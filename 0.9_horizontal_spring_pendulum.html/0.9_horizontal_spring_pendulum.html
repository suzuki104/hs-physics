<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水平ばね振り子</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            background: #e2e8f0;
            height: 6px;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #2563eb;
            margin-top: -5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const IconPlay = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const IconPause = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        );
        const IconRotate = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        );
        const IconActivity = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        );
        const IconHome = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        );
        const IconList = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        );

        const App = () => {
            const [mass, setMass] = useState(2.0);
            const [k, setK] = useState(10.0);
            const [amplitude, setAmplitude] = useState(100);
            const [phaseType, setPhaseType] = useState("cos");
            
            const [isPlaying, setIsPlaying] = useState(false);
            const [hasStarted, setHasStarted] = useState(false);
            const [showX, setShowX] = useState(true);
            const [showV, setShowV] = useState(true);
            const [showA, setShowA] = useState(true);
            const [time, setTime] = useState(0);
            
            const omega = useMemo(() => Math.sqrt(k / mass), [k, mass]);
            const period = useMemo(() => 2 * Math.PI / omega, [omega]);

            const getPhysics = (t) => {
                let x, v, a;
                const wt = omega * t;
                switch(phaseType) {
                    case "sin":
                        x = amplitude * Math.sin(wt);
                        v = amplitude * omega * Math.cos(wt);
                        a = -amplitude * omega * omega * Math.sin(wt);
                        break;
                    case "-cos":
                        x = -amplitude * Math.cos(wt);
                        v = amplitude * omega * Math.sin(wt);
                        a = amplitude * omega * omega * Math.cos(wt);
                        break;
                    case "-sin":
                        x = -amplitude * Math.sin(wt);
                        v = -amplitude * omega * Math.cos(wt);
                        a = amplitude * omega * omega * Math.sin(wt);
                        break;
                    case "cos":
                    default:
                        x = amplitude * Math.cos(wt);
                        v = -amplitude * omega * Math.sin(wt);
                        a = -amplitude * omega * omega * Math.cos(wt);
                        break;
                }
                return { x, v, a };
            };

            const [history, setHistory] = useState([]);
            const requestRef = useRef();

            useEffect(() => {
                const initial = getPhysics(0);
                setHistory([{ t: 0, ...initial }]);
            }, [phaseType, amplitude, omega]);

            const animate = () => {
                if (isPlaying) {
                    setTime(prevTime => {
                        const newTime = prevTime + 0.02;
                        const state = getPhysics(newTime);
                        setHistory(prev => {
                            const newHistory = [...prev, { t: newTime, ...state }];
                            return newHistory.length > 800 ? newHistory.slice(1) : newHistory;
                        });
                        return newTime;
                    });
                }
                requestRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [isPlaying, phaseType, amplitude, omega]);

            const handleTogglePlay = () => {
                if (!hasStarted) setHasStarted(true);
                setIsPlaying(!isPlaying);
            };

            const resetSimulation = () => {
                setTime(0);
                setIsPlaying(false);
                setHasStarted(false);
                const initial = getPhysics(0);
                setHistory([{ t: 0, ...initial }]);
            };

            const canvasWidth = 600;
            const canvasHeight = 220;
            const centerX = canvasWidth / 2;
            const currentX = centerX + getPhysics(time).x;
            const wallX = 50;
            const floorY = 160;
            const objectSize = 50;

            const renderSpring = () => {
                const segments = 25;
                const springPath = [];
                const dist = currentX - wallX - (objectSize / 2);
                for (let i = 0; i <= segments; i++) {
                    const px = wallX + (dist / segments) * i;
                    let py = floorY - (objectSize / 2);
                    if (i > 0 && i < segments) py = i % 2 === 0 ? floorY - objectSize + 10 : floorY - 10;
                    springPath.push(`${px},${py}`);
                }
                return springPath.join(' ');
            };

            const getGraphPoints = (type) => {
                if (history.length === 0) return "";
                const margin = 40;
                const graphWidth = 520;
                const maxT = Math.max(time, 5);
                return history.map(d => {
                    const xCoord = margin + (d.t / maxT) * graphWidth;
                    let val = 0;
                    let scale = 0.7;
                    if (type === 'x') val = d.x;
                    if (type === 'v') { val = d.v; scale = 0.7 / omega; }
                    if (type === 'a') { val = d.a; scale = 0.7 / (omega * omega); }
                    const yCoord = 100 - (val * scale);
                    return `${xCoord},${yCoord}`;
                }).join(' ');
            };

            return (
                <div className="flex flex-col items-center p-4 bg-slate-100 min-h-screen font-sans text-slate-900">
                    <div className="max-w-4xl w-full bg-white rounded-2xl shadow-2xl p-6 md:p-8">
                        {/* ナビゲーションボタンエリア */}
                        <div className="flex gap-3 mb-8">
                            <a 
                                href="../6.0_home/home.html" 
                                className="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-full transition-all shadow-sm active:scale-95"
                            >
                                <IconHome />
                                ホーム
                            </a>
                            <a 
                                href="../6.1_physics_home/physics_home.html" 
                                className="flex items-center gap-2 px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-bold rounded-full transition-all shadow-sm active:scale-95 border border-slate-300"
                            >
                                <IconList />
                                物理一覧
                            </a>
                        </div>

                        <h1 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                            <span className="text-blue-600"><IconActivity /></span>
                            水平ばね振り子
                        </h1>

                        <div className="relative w-full h-56 bg-gradient-to-b from-sky-50 to-white rounded-t-lg border-x border-t border-slate-300 overflow-hidden">
                            <svg width="100%" height="100%" viewBox={`0 0 ${canvasWidth} ${canvasHeight}`} preserveAspectRatio="xMidYMid meet">
                                <line x1={centerX} y1="40" x2={centerX} y2={floorY} stroke="#ef4444" strokeWidth="1" strokeDasharray="4" opacity="0.5" />
                                <ellipse cx={currentX} cy={floorY} rx="25" ry="4" fill="black" opacity="0.1" />
                                <polyline points={renderSpring()} fill="none" stroke="#64748b" strokeWidth="2" strokeLinejoin="round" />
                                <rect x={currentX - 25} y={floorY - objectSize} width={objectSize} height={objectSize} rx="2" fill="#2563eb" stroke="#1e3a8a" strokeWidth="1" />
                                <rect x="0" y="40" width="50" height={floorY - 40} fill="#475569" />
                                <line x1="50" y1="40" x2="50" y2={floorY} stroke="#1e293b" strokeWidth="3" />
                                <rect x="0" y={floorY} width={canvasWidth} height="60" fill="#cbd5e1" />
                                <line x1="0" y1={floorY} x2={canvasWidth} y2={floorY} stroke="#94a3b8" strokeWidth="2" />
                                
                                {!isPlaying && !hasStarted && (phaseType === 'sin' || phaseType === '-sin') ? (
                                    <g transform={`translate(${currentX + (phaseType === 'sin' ? -65 : 65)}, ${floorY - 30})`}>
                                        <text x="-18" y="-15" fontSize="12" fontWeight="bold" fill="#64748b">PUSH!</text>
                                        <path d="M0,0 L20,10 L0,20" fill="#94a3b8" transform={phaseType === 'sin' ? "" : "scale(-1,1)"}/>
                                    </g>
                                ) : (
                                    Math.abs(currentX - centerX) > 5 && (
                                        <g>
                                            <line x1={currentX} y1={floorY - objectSize - 15} x2={centerX} y2={floorY - objectSize - 15} stroke="#ef4444" strokeWidth="3" markerEnd="url(#arrowhead)" />
                                            <text x={(currentX + centerX)/2 - 5} y={floorY - objectSize - 25} fontSize="14" fill="#ef4444" fontWeight="bold">F</text>
                                        </g>
                                    )
                                )}
                                
                                <defs>
                                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
                                    </marker>
                                </defs>
                            </svg>
                        </div>

                        <div className="w-full h-72 bg-white rounded-b-lg p-4 mb-8 relative border border-slate-300 border-t-0 shadow-inner">
                            <div className="absolute top-2 right-4 flex gap-2 z-10">
                                <button onClick={() => setShowX(!showX)} className={`px-2 py-1 rounded text-[10px] font-bold transition shadow-sm ${showX ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}`}>変位 x</button>
                                <button onClick={() => setShowV(!showV)} className={`px-2 py-1 rounded text-[10px] font-bold transition shadow-sm ${showV ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-400'}`}>速度 v</button>
                                <button onClick={() => setShowA(!showA)} className={`px-2 py-1 rounded text-[10px] font-bold transition shadow-sm ${showA ? 'bg-orange-600 text-white' : 'bg-slate-100 text-slate-400'}`}>加速度 a</button>
                            </div>
                            
                            <svg width="100%" height="100%" viewBox="0 0 600 200" preserveAspectRatio="none">
                                <line x1="40" y1="100" x2="580" y2="100" stroke="#475569" strokeWidth="2" />
                                <line x1="40" y1="10" x2="40" y2="190" stroke="#475569" strokeWidth="2" />
                                
                                <text x="585" y="105" fontSize="12" fontWeight="bold" fill="#475569">t</text>
                                {showX && <text x="25" y="20" fontSize="12" fontWeight="bold" fill="#2563eb">x</text>}
                                {showV && <text x="10" y="20" fontSize="12" fontWeight="bold" fill="#059669">v</text>}
                                {showA && <text x="-5" y="20" fontSize="12" fontWeight="bold" fill="#ea580c" transform="translate(45,0)">a</text>}

                                {showA && <polyline points={getGraphPoints('a')} fill="none" stroke="#f97316" strokeWidth="2" opacity="0.6" />}
                                {showV && <polyline points={getGraphPoints('v')} fill="none" stroke="#10b981" strokeWidth="2" opacity="0.6" />}
                                {showX && <polyline points={getGraphPoints('x')} fill="none" stroke="#3b82f6" strokeWidth="2.5" />}
                                
                                {history.length > 0 && isPlaying && (
                                    <circle cx={40 + (time / Math.max(time, 5)) * 520} cy={100 - (getPhysics(time).x * 0.7)} r="3" fill="#3b82f6" />
                                )}
                            </svg>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white p-6 rounded-xl border border-slate-200">
                            <div className="space-y-4">
                                <div className="flex gap-4">
                                    <button 
                                        onClick={handleTogglePlay} 
                                        className={`flex-1 py-3 rounded-lg font-bold text-white transition shadow-md flex items-center justify-center gap-2 ${!hasStarted ? 'bg-blue-600 hover:bg-blue-700' : isPlaying ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                    >
                                        {!hasStarted || !isPlaying ? <IconPlay /> : <IconPause />}
                                        {!hasStarted ? 'スタート' : isPlaying ? '一時停止' : '再開'}
                                    </button>
                                    <button onClick={resetSimulation} className="p-3 bg-slate-100 rounded-lg text-slate-600 hover:bg-slate-200 transition">
                                        <IconRotate />
                                    </button>
                                </div>
                                
                                <div>
                                    <label className="text-xs font-bold block mb-2 text-slate-500 uppercase tracking-wider">初期状態（位相）</label>
                                    <select 
                                        value={phaseType} 
                                        onChange={(e) => {setPhaseType(e.target.value); resetSimulation();}}
                                        className="w-full p-2 border border-slate-300 rounded-md text-sm font-bold bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none"
                                    >
                                        <option value="cos">x = A cos(ωt) [右端から開始]</option>
                                        <option value="sin">x = A sin(ωt) [中心から右へ開始]</option>
                                        <option value="-cos">x = -A cos(ωt) [左端から開始]</option>
                                        <option value="-sin">x = -A sin(ωt) [中心から左へ開始]</option>
                                    </select>
                                </div>
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-xs font-bold text-slate-600">質量 m: {mass.toFixed(1)} kg</label>
                                    </div>
                                    <input type="range" min="0.5" max="5.0" step="0.1" value={mass} onChange={(e) => setMass(parseFloat(e.target.value))} className="w-full" />
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-xs font-bold text-slate-600">ばね定数 k: {k.toFixed(1)} N/m</label>
                                    </div>
                                    <input type="range" min="5.0" max="30.0" step="1.0" value={k} onChange={(e) => setK(parseFloat(e.target.value))} className="w-full" />
                                </div>
                                <div className="p-3 bg-slate-50 rounded-lg flex justify-around items-center border border-slate-100">
                                    <div className="text-center">
                                        <p className="text-[10px] text-slate-400 font-bold uppercase">周期 T</p>
                                        <p className="text-sm font-mono font-bold text-blue-600">{period.toFixed(2)}s</p>
                                    </div>
                                    <div className="text-center">
                                        <p className="text-[10px] text-slate-400 font-bold uppercase">角振動数 ω</p>
                                        <p className="text-sm font-mono font-bold text-blue-600">{omega.toFixed(2)} rad/s</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
