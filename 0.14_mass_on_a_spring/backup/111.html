<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ばねと物体の運動 - 高校物理教材</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            touch-action: none;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <h1 class="text-3xl font-bold text-slate-800 mb-6">ばねと物体の運動（自由落下・自然長固定）</h1>

    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
        
        <!-- Controls & Data (Left Side) -->
        <div class="control-panel p-6 border border-slate-200 rounded-xl shadow-sm flex flex-col gap-6 text-sm lg:col-span-1">
            <div class="flex flex-col gap-4">
                <button id="playPauseBtn" class="w-full px-6 py-3 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition shadow-md font-bold">落下開始 / 一時停止</button>
                <button id="resetBtn" class="w-full px-6 py-3 bg-slate-600 text-white rounded-full hover:bg-slate-700 transition shadow-md font-bold">リセット</button>
            </div>

            <!-- Simulation Canvas -->
            <div class="flex flex-col items-center">
                <canvas id="simCanvas" width="240" height="400" class="w-full h-auto border border-slate-200"></canvas>
                <p class="mt-2 text-slate-500 font-bold">シミュレーション表示</p>
            </div>

            <!-- Real-time Data Display -->
            <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-inner flex flex-col gap-2 font-mono text-xs">
                <div class="flex justify-between text-blue-600">
                    <span>ばね上端(y₁):</span>
                    <span id="y1Val">0.00</span> m
                </div>
                <div class="flex justify-between text-red-600">
                    <span>おもり(y₂):</span>
                    <span id="y2Val">0.00</span> m
                </div>
                <div class="flex justify-between text-slate-600 pt-2 border-t">
                    <span>経過時間:</span>
                    <span id="timeVal">0.00</span> s
                </div>
            </div>

            <hr>
            <div>
                <label class="block font-bold mb-2 text-slate-700">再生速度: <span id="speedVal">0.1</span>x</label>
                <input type="range" id="speedInput" min="0.1" max="2.0" step="0.1" value="0.1" class="w-full">
            </div>
            <div>
                <label class="block font-bold mb-2 text-slate-700">ばね定数 (k): <span id="kVal">20</span> N/m</label>
                <input type="range" id="kInput" min="5" max="50" value="20" class="w-full">
            </div>
            <div>
                <label class="block font-bold mb-2 text-slate-700">質量 (m): <span id="mVal">10.0</span> kg</label>
                <input type="range" id="mInput" min="0.5" max="50.0" step="0.5" value="10.0" class="w-full">
            </div>
        </div>

        <!-- Graph Canvas -->
        <div class="lg:col-span-3 flex flex-col items-center">
            <canvas id="graphCanvas" width="800" height="600" class="w-full h-auto border border-slate-200"></canvas>
            <p class="mt-2 text-slate-500 font-bold">時間-変位グラフ (全体像を表示)</p>
        </div>
    </div>

    <footer class="w-full max-w-4xl mt-auto pt-8 border-t border-slate-200 flex flex-col items-center gap-4">
        <div class="flex gap-4">
            <a href="../6.0_home/home.html" class="px-6 py-2 bg-white border border-slate-300 text-slate-700 rounded-md hover:bg-slate-50 transition shadow-sm">ホーム</a>
            <a href="../6.1_physics_home/physics_home.html" class="px-6 py-2 bg-white border border-slate-300 text-slate-700 rounded-md hover:bg-slate-50 transition shadow-sm">物理一覧</a>
        </div>
        <p class="text-slate-500 text-xs mb-4" id="copyright"></p>
    </footer>

    <script>
        document.getElementById('copyright').innerHTML = `Copyright &copy; 2021-${new Date().getFullYear()} T.Suzuki`;

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const gctx = graphCanvas.getContext('2d');
        
        const y1Display = document.getElementById('y1Val');
        const y2Display = document.getElementById('y2Val');
        const timeDisplay = document.getElementById('timeVal');

        // Physics constants
        let k = 20;        
        let m = 10.0;       
        let simSpeed = 0.1; 
        const m_spring = 0.2; 
        const g = 9.8;     
        const ppi = 40;    
        
        const ceilingY_m = 0.8; 
        const naturalLength_m = 2.0; 
        const fallLimit_m = 50; 
        
        // State variables
        let springTopY = ceilingY_m; 
        let objectY = ceilingY_m + naturalLength_m + (10.0 * g / 20); 
        let v_top = 0, v_obj = 0;    
        let isRunning = false, isAttached = true, isLatched = false;
        let lastTime = 0, elapsedSimTime = 0;
        let maxTimeOnGraph = 1.0; 
        
        // Graph data
        let history = []; 

        const kInput = document.getElementById('kInput');
        const mInput = document.getElementById('mInput');
        const speedInput = document.getElementById('speedInput');
        const kVal = document.getElementById('kVal');
        const mVal = document.getElementById('mVal');
        const speedVal = document.getElementById('speedVal');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Calculate time to reach natural length during free fall
        function calculateLatchTime() {
            // omega = sqrt(k * (1/m + 1/ms))
            const omega = Math.sqrt(k * (1/m + 1/m_spring));
            // Latch when omega * t = PI/2
            const t_latch = Math.PI / (2 * omega);
            // 自然長になる瞬間がグラフの右端に近いようにスケールを設定 (1.1倍程度の余白)
            return Math.max(0.5, t_latch * 1.1);
        }

        function updateEquilibrium() {
            if (isAttached) {
                springTopY = ceilingY_m;
                objectY = ceilingY_m + naturalLength_m + (m * g / k);
                v_top = 0; v_obj = 0;
                elapsedSimTime = 0;
                history = [];
                isLatched = false;
                maxTimeOnGraph = calculateLatchTime();
                updateValueDisplay();
            }
        }

        function updateValueDisplay() {
            y1Display.innerText = Math.max(0, (springTopY - ceilingY_m)).toFixed(2);
            y2Display.innerText = Math.max(0, (objectY - ceilingY_m)).toFixed(2);
            timeDisplay.innerText = elapsedSimTime.toFixed(2);
        }

        kInput.addEventListener('input', (e) => { k = parseFloat(e.target.value); kVal.innerText = k; updateEquilibrium(); });
        mInput.addEventListener('input', (e) => { m = parseFloat(e.target.value); mVal.innerText = m.toFixed(1); updateEquilibrium(); });
        speedInput.addEventListener('input', (e) => { simSpeed = parseFloat(e.target.value); speedVal.innerText = simSpeed.toFixed(1); });
        
        playPauseBtn.addEventListener('click', () => { 
            isRunning = !isRunning; 
            if (isRunning) isAttached = false; 
        });
        
        resetBtn.addEventListener('click', () => {
            isAttached = true;
            isLatched = false;
            isRunning = false;
            updateEquilibrium();
            draw();
        });

        function drawSpring(yTop, yBottom) {
            const coils = 20;
            const width = 15;
            const length = yBottom - yTop;
            const centerX = canvas.width / 2;
            ctx.beginPath();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.moveTo(centerX, yTop);
            for (let i = 0; i <= coils; i++) {
                const fraction = i / coils;
                const currY = yTop + fraction * length;
                const currX = centerX + (i % 2 === 0 ? width : -width) * (i === 0 || i === coils ? 0 : 1);
                ctx.lineTo(currX, currY);
            }
            ctx.stroke();
        }

        function drawGraph() {
            gctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            const padding = 50;
            const gWidth = graphCanvas.width - padding * 2;
            const gHeight = graphCanvas.height - padding * 2;

            gctx.strokeStyle = '#334155';
            gctx.lineWidth = 1;
            gctx.beginPath();
            gctx.moveTo(padding, padding);
            gctx.lineTo(padding, graphCanvas.height - padding);
            gctx.lineTo(graphCanvas.width - padding, graphCanvas.height - padding);
            gctx.stroke();

            gctx.fillStyle = '#334155';
            gctx.font = '12px Arial';
            gctx.fillText('時間 (s)', graphCanvas.width - 60, graphCanvas.height - padding + 20);
            gctx.save();
            gctx.translate(padding - 35, padding + 40);
            gctx.rotate(-Math.PI/2);
            gctx.fillText('落下距離 (m)', 0, 0);
            gctx.restore();

            const maxT = Math.max(maxTimeOnGraph, elapsedSimTime);
            const maxY = fallLimit_m + 5; 

            const scaleT = gWidth / maxT;
            const scaleY = gHeight / maxY;

            gctx.textAlign = 'center';
            let step = 0.1;
            if (maxT > 1) step = 0.2;
            if (maxT > 2) step = 0.5;
            if (maxT > 5) step = 1;
            if (maxT > 10) step = 2;

            for (let s = 0; s <= maxT + 0.01; s += step) {
                const x = padding + s * scaleT;
                gctx.fillText(s.toFixed(1), x, graphCanvas.height - padding + 15);
            }

            if (history.length < 2) return;

            // Spring Top Plot (Blue)
            gctx.beginPath();
            gctx.strokeStyle = '#3b82f6';
            gctx.lineWidth = 2;
            history.forEach((point, i) => {
                const x = padding + point.t * scaleT;
                const y = padding + (point.y_top - ceilingY_m) * scaleY;
                if (i === 0) gctx.moveTo(x, y); else gctx.lineTo(x, y);
            });
            gctx.stroke();

            // Object Plot (Red)
            gctx.beginPath();
            gctx.strokeStyle = '#ef4444';
            gctx.lineWidth = 2;
            history.forEach((point, i) => {
                const x = padding + point.t * scaleT;
                const y = padding + (point.y_obj - ceilingY_m) * scaleY;
                if (i === 0) gctx.moveTo(x, y); else gctx.lineTo(x, y);
            });
            gctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const drawTopY = springTopY * ppi;
            const drawObjY = objectY * ppi;
            const centerX = canvas.width / 2;

            ctx.fillStyle = '#334155';
            ctx.fillRect(centerX - 30, (ceilingY_m * ppi) - 5, 60, 5);

            drawSpring(drawTopY, drawObjY);

            ctx.beginPath();
            ctx.arc(centerX, drawObjY, 12, 0, Math.PI * 2);
            ctx.fillStyle = isLatched ? '#10b981' : '#ef4444';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(centerX, drawTopY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#3b82f6';
            ctx.fill();

            drawGraph();
        }

        function update(timestamp) {
            if (isRunning && !isAttached) {
                const dt = Math.min((timestamp - lastTime) / 1000, 0.02) * simSpeed;
                elapsedSimTime += dt;
                
                const currentLength = objectY - springTopY;
                
                if (!isLatched && currentLength <= naturalLength_m) {
                    isLatched = true;
                    const v_center = (m * v_obj + m_spring * v_top) / (m + m_spring);
                    v_obj = v_center;
                    v_top = v_center;
                    objectY = springTopY + naturalLength_m;
                }

                if (isLatched) {
                    v_obj += g * dt;
                    v_top += g * dt;
                    objectY += v_obj * dt;
                    springTopY += v_top * dt;
                } else {
                    const stretch = currentLength - naturalLength_m;
                    const springForce = k * stretch;

                    const aObj = g - (springForce / m);
                    v_obj += aObj * dt;
                    objectY += v_obj * dt;

                    const aTop = g + (springForce / m_spring);
                    v_top += aTop * dt;
                    springTopY += v_top * dt;
                }

                history.push({t: elapsedSimTime, y_top: springTopY, y_obj: objectY});
                updateValueDisplay();

                if (springTopY > fallLimit_m) {
                    isRunning = false;
                }
            }
            
            lastTime = timestamp;
            draw();
            requestAnimationFrame(update);
        }

        updateEquilibrium();
        draw();
        requestAnimationFrame(update);

    </script>
</body>
</html>
