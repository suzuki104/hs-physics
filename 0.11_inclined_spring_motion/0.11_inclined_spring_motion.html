<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>斜面上のばね振り子による単振動</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            touch-action: manipulation;
        }
        input[type="checkbox"] { accent-color: #3b82f6; }
        * { -webkit-tap-highlight-color: transparent; }
        
        .touch-btn {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        input[type="range"] {
            height: 1.5rem;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const IconPlay = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style={{pointerEvents: 'none'}}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconPause = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style={{pointerEvents: 'none'}}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
        const IconRotate = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{pointerEvents: 'none'}}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;

        const App = () => {
            const [mass, setMass] = useState(2.0);
            const [k, setK] = useState(10.0);
            const [angleDeg, setAngleDeg] = useState(30);
            const [amplitude, setAmplitude] = useState(60);
            const [phaseType, setPhaseType] = useState("cos"); 
            const g = 9.8;

            const [isPlaying, setIsPlaying] = useState(false);
            const [time, setTime] = useState(0);
            const [history, setHistory] = useState([]);
            
            const [showX, setShowX] = useState(true);
            const [showV, setShowV] = useState(true);
            const [showA, setShowA] = useState(true);

            const angleRad = useMemo(() => (angleDeg * Math.PI) / 180, [angleDeg]);
            const omega = useMemo(() => Math.sqrt(k / mass), [k, mass]);
            const pxPerMeter = 35;
            const equilibriumOffset = useMemo(() => ((mass * g * Math.sin(angleRad)) / k) * pxPerMeter, [mass, k, angleRad]);

            const getPhysicsData = (t) => {
                const wt = omega * t;
                const A = amplitude;
                let x = 0, v = 0, a = 0;
                switch(phaseType) {
                    case "cos": x = A * Math.cos(wt); v = -A * omega * Math.sin(wt); a = -A * omega * omega * Math.cos(wt); break;
                    case "-cos": x = -A * Math.cos(wt); v = A * omega * Math.sin(wt); a = A * omega * omega * Math.cos(wt); break;
                    case "sin": x = A * Math.sin(wt); v = A * omega * Math.cos(wt); a = -A * omega * omega * Math.sin(wt); break;
                    case "-sin": x = -A * Math.sin(wt); v = -A * omega * Math.cos(wt); a = A * omega * omega * Math.sin(wt); break;
                }
                return { x, v, a };
            };

            useEffect(() => {
                const initialData = getPhysicsData(0);
                setHistory([{ t: 0, ...initialData }]);
                setTime(0);
                setIsPlaying(false);
            }, [phaseType, amplitude, omega, angleDeg, mass, k]);

            const requestRef = useRef();
            useEffect(() => {
                const animate = () => {
                    if (isPlaying) {
                        setTime(prev => {
                            const newTime = prev + 0.02;
                            const data = getPhysicsData(newTime);
                            setHistory(h => [...h, { t: newTime, ...data }]);
                            return newTime;
                        });
                    }
                    requestRef.current = requestAnimationFrame(animate);
                };
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [isPlaying, omega, phaseType, amplitude]);

            const handleTogglePlay = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                setIsPlaying(!isPlaying);
            };

            const handleReset = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                setTime(0);
                setIsPlaying(false);
                const initialData = getPhysicsData(0);
                setHistory([{ t: 0, ...initialData }]);
            };

            const canvasWidth = 600;
            const canvasHeight = 280;
            const baseStartX = 80; 
            const baseStartY = 40;
            const objectSize = 44;
            const naturalLen = 120; 
            const halfSize = objectSize / 2;
            
            const currentData = getPhysicsData(time);
            const currentDist = naturalLen + equilibriumOffset + currentData.x;
            const normalX = Math.cos(angleRad - Math.PI/2);
            const normalY = Math.sin(angleRad - Math.PI/2);
            const objCenterX = baseStartX + currentDist * Math.cos(angleRad) + halfSize * normalX;
            const objCenterY = baseStartY + currentDist * Math.sin(angleRad) + halfSize * normalY;

            const renderSpring = () => {
                const segments = 30;
                const points = [];
                const wallConnX = baseStartX + halfSize * normalX;
                const wallConnY = baseStartY + halfSize * normalY;
                const objEdgeDist = currentDist - halfSize;
                const objConnX = baseStartX + objEdgeDist * Math.cos(angleRad) + halfSize * normalX;
                const objConnY = baseStartY + objEdgeDist * Math.sin(angleRad) + halfSize * normalY;
                for (let i = 0; i <= segments; i++) {
                    const p = i / segments;
                    let wave = (i > 0 && i < segments) ? (i % 2 === 0 ? 8 : -8) : 0;
                    const posX = wallConnX + (p * (objConnX - wallConnX)) + wave * normalX;
                    const posY = wallConnY + (p * (objConnY - wallConnY)) + wave * normalY;
                    points.push(`${posX},${posY}`);
                }
                return points.join(' ');
            };

            const CombinedGraph = () => {
                const w = 400, h = 180;
                const maxT = Math.max(10, time);
                
                const getPoints = (key, scale) => {
                    if (history.length === 0) return "";
                    return history
                        .map(d => {
                            const px = (d.t / maxT) * w;
                            const py = h / 2 - (d[key] * scale);
                            return isNaN(px) || isNaN(py) ? null : `${px},${py}`;
                        })
                        .filter(p => p !== null)
                        .join(' ');
                };

                return (
                    <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm w-full">
                        <div className="flex flex-wrap gap-4 mb-3 text-[11px] font-bold">
                            <label className="flex items-center gap-1.5 text-blue-600 cursor-pointer">
                                <input type="checkbox" className="w-4 h-4" checked={showX} onChange={() => setShowX(!showX)} /> 変位x
                            </label>
                            <label className="flex items-center gap-1.5 text-emerald-600 cursor-pointer">
                                <input type="checkbox" className="w-4 h-4" checked={showV} onChange={() => setShowV(!showV)} /> 速度v
                            </label>
                            <label className="flex items-center gap-1.5 text-rose-600 cursor-pointer">
                                <input type="checkbox" className="w-4 h-4" checked={showA} onChange={() => setShowA(!showA)} /> 加速度a
                            </label>
                        </div>
                        <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} className="overflow-visible">
                            <line x1="0" y1={h/2} x2={w} y2={h/2} stroke="#cbd5e1" strokeWidth="1" />
                            <line x1="0" y1="0" x2="0" y2={h} stroke="#cbd5e1" strokeWidth="1" />
                            {showX && history.length > 0 && <polyline points={getPoints('x', 0.6)} fill="none" stroke="#3b82f6" strokeWidth="2.5" strokeLinejoin="round" />}
                            {showV && history.length > 0 && <polyline points={getPoints('v', 0.2)} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinejoin="round" />}
                            {showA && history.length > 0 && <polyline points={getPoints('a', 0.05)} fill="none" stroke="#f43f5e" strokeWidth="2.5" strokeLinejoin="round" />}
                        </svg>
                    </div>
                );
            };

            return (
                <div className="flex flex-col items-center p-4 md:p-6 bg-slate-50 min-h-screen text-slate-800">
                    <h1 className="text-xl md:text-2xl font-black mb-6 tracking-tight text-center">斜面上のばね振り子による単振動</h1>

                    <div className="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-5 gap-6 mb-10">
                        {/* 左側：シミュレーション画面とボタン */}
                        <div className="lg:col-span-3 space-y-4">
                            <div className="relative aspect-video bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                                <svg width="100%" height="100%" viewBox={`0 0 ${canvasWidth} ${canvasHeight}`} className="touch-none">
                                    <defs>
                                        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
                                        </marker>
                                        <marker id="axisArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
                                        </marker>
                                    </defs>

                                    <path 
                                        d={`M ${baseStartX} ${baseStartY} L ${baseStartX + 800 * Math.cos(angleRad)} ${baseStartY + 800 * Math.sin(angleRad)} L ${baseStartX + 800 * Math.cos(angleRad)} ${canvasHeight} L ${baseStartX - 50} ${canvasHeight} L ${baseStartX - 50} ${baseStartY} Z`} 
                                        fill="#f1f5f9" stroke="#e2e8f0" 
                                    />
                                    
                                    <g transform={`translate(${baseStartX - 15 * normalX}, ${baseStartY - 15 * normalY + 20})`}>
                                        <line 
                                            x1="0" y1="0" 
                                            x2={380 * Math.cos(angleRad)} 
                                            y2={380 * Math.sin(angleRad)} 
                                            stroke="#94a3b8" strokeWidth="1" markerEnd="url(#axisArrow)" 
                                        />
                                        <text x={395 * Math.cos(angleRad)} y={395 * Math.sin(angleRad)} fill="#94a3b8" fontSize="14" fontWeight="bold" fontStyle="italic">y</text>
                                    </g>

                                    <line x1={baseStartX} y1={baseStartY} x2={baseStartX + 600 * Math.cos(angleRad)} y2={baseStartY + 600 * Math.sin(angleRad)} stroke="#334155" strokeWidth="4" />
                                    
                                    <g>
                                        <line 
                                            x1={baseStartX + (naturalLen + equilibriumOffset) * Math.cos(angleRad)} 
                                            y1={baseStartY + (naturalLen + equilibriumOffset) * Math.sin(angleRad)}
                                            x2={baseStartX + (naturalLen + equilibriumOffset) * Math.cos(angleRad) + 60 * normalX} 
                                            y2={baseStartY + (naturalLen + equilibriumOffset) * Math.sin(angleRad) + 60 * normalY}
                                            stroke="#ef4444" strokeWidth="2" strokeDasharray="6,4" 
                                        />
                                        <text x={baseStartX + (naturalLen + equilibriumOffset) * Math.cos(angleRad) + 65 * normalX} y={baseStartY + (naturalLen + equilibriumOffset) * Math.sin(angleRad) + 65 * normalY + 4} fill="#ef4444" fontSize="12" fontWeight="bold">つりあいの位置</text>
                                    </g>

                                    <g transform={`translate(${baseStartX}, ${baseStartY}) rotate(${angleDeg})`}>
                                        <rect x="-12" y="-2" width="12" height="60" fill="#475569" transform="scale(1,-1)" />
                                    </g>

                                    <polyline points={renderSpring()} fill="none" stroke="#64748b" strokeWidth="2.5" />
                                    
                                    <g transform={`translate(${objCenterX}, ${objCenterY}) rotate(${angleDeg})`}>
                                        <rect x={-halfSize} y={-halfSize} width={objectSize} height={objectSize} fill="#3b82f6" stroke="#1d4ed8" strokeWidth="2" />
                                        {(phaseType === "sin" || phaseType === "-sin") && time === 0 && !isPlaying && (
                                            <g>
                                                {phaseType === "sin" ? (
                                                    <g>
                                                        <line x1={-halfSize - 45} y1="0" x2={-halfSize} y2="0" stroke="#f59e0b" strokeWidth="4" markerEnd="url(#arrow)" />
                                                        <circle r="18" fill="#f59e0b" cx={-halfSize - 45} cy="0" />
                                                        <text x={-halfSize - 45} y="4" fontSize="9" fontWeight="900" fill="white" textAnchor="middle">PUSH</text>
                                                    </g>
                                                ) : (
                                                    <g>
                                                        <line x1={halfSize + 45} y1="0" x2={halfSize} y2="0" stroke="#f59e0b" strokeWidth="4" markerEnd="url(#arrow)" />
                                                        <circle r="18" fill="#f59e0b" cx={halfSize + 45} cy="0" />
                                                        <text x={halfSize + 45} y="4" fontSize="9" fontWeight="900" fill="white" textAnchor="middle">PUSH</text>
                                                    </g>
                                                )}
                                            </g>
                                        )}
                                    </g>
                                </svg>
                            </div>

                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4">
                                <div className="flex-1 flex gap-3">
                                    <button 
                                        onPointerDown={handleTogglePlay}
                                        className={`touch-btn flex-1 py-5 rounded-2xl font-bold text-white transition-all shadow-lg flex items-center justify-center gap-2 active:scale-95 ${isPlaying ? 'bg-amber-500' : 'bg-blue-600'}`}
                                    >
                                        {isPlaying ? <IconPause /> : <IconPlay />}
                                        <span className="text-lg">{isPlaying ? '一時停止' : '開始'}</span>
                                    </button>
                                    <button 
                                        onPointerDown={handleReset}
                                        className="touch-btn px-6 bg-slate-100 rounded-2xl text-slate-600 transition active:scale-95 flex items-center justify-center shadow-sm"
                                    >
                                        <IconRotate />
                                    </button>
                                </div>
                                <div className="flex-1">
                                    <label className="text-[10px] font-black text-slate-400 mb-1 block uppercase tracking-wider">開始時の状態</label>
                                    <select value={phaseType} onChange={(e) => {setPhaseType(e.target.value); handleReset();}} className="w-full p-4 border-2 border-slate-100 rounded-2xl text-sm font-bold focus:border-blue-500 outline-none bg-slate-50 cursor-pointer">
                                        <option value="cos">一番下（最大伸び）から</option>
                                        <option value="-cos">一番上（最小伸び）から</option>
                                        <option value="sin">つりあいから下へ</option>
                                        <option value="-sin">つりあいから上へ</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* 右側：グラフとパラメータ設定 */}
                        <div className="lg:col-span-2 flex flex-col gap-4">
                            <CombinedGraph />
                            
                            {/* スライダーエリア */}
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-50 pb-2">シミュレーション設定</h3>
                                <div className="space-y-5">
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <span className="text-sm font-bold text-slate-600">斜面の角度</span>
                                            <span className="text-sm font-bold font-mono text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">{angleDeg}°</span>
                                        </div>
                                        <input type="range" min="10" max="60" step="1" value={angleDeg} onChange={(e) => setAngleDeg(parseInt(e.target.value))} className="w-full bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <span className="text-sm font-bold text-slate-600">おもりの質量</span>
                                            <span className="text-sm font-bold font-mono text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">{mass}kg</span>
                                        </div>
                                        <input type="range" min="0.5" max="5.0" step="0.1" value={mass} onChange={(e) => setMass(parseFloat(e.target.value))} className="w-full bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                                    </div>
                                </div>
                            </div>

                            {/* 物理量出力 */}
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">現在の物理量</h3>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-end border-b border-slate-50 pb-2">
                                        <span className="text-sm font-bold text-slate-500">角振動数 ω</span>
                                        <span className="text-xl font-black font-mono text-slate-700">{omega.toFixed(2)}<span className="text-[10px] ml-1">rad/s</span></span>
                                    </div>
                                    <div className="flex justify-between items-end">
                                        <span className="text-sm font-bold text-slate-500">周期 T</span>
                                        <span className="text-xl font-black font-mono text-slate-700">{(2 * Math.PI / omega).toFixed(2)}<span className="text-[10px] ml-1">s</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="mt-auto flex flex-col items-center gap-8 pb-12 w-full">
                        <div className="flex flex-wrap justify-center gap-4 w-full px-4 text-center">
                        </div>
                        <div className="text-slate-400 text-[11px] font-medium tracking-widest flex items-center gap-1">
                            Copyright &copy; 2021-{new Date().getFullYear()} T.Suzuki
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
