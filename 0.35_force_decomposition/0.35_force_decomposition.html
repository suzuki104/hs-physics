<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>力の分解|高校物理アニメーション教材</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f1f5f9;
            user-select: none;
        }
        canvas {
            cursor: crosshair;
            touch-action: pan-x pan-y; /* キャンバス上でのスクロールを許可 */
            background-color: #ffffff;
        }
        .math-font {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }
    </style>
</head>
<body class="flex flex-col items-center p-4">
    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-6 flex flex-col gap-6">
        <h1 class="text-2xl font-bold text-gray-800 text-center">力の分解</h1>
        <p class="text-center text-gray-600 text-sm -mt-4">力F・x'軸・y'軸の⚫︎を操作して、力の大きさ・向き・分解の軸の方向を変えてみましょう</p>
        
        <div class="flex flex-wrap justify-center gap-2">
            <button id="make-ortho" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded shadow-sm text-sm font-bold transition-all">
                y'軸をx'軸に対して直角に修正
            </button>
            <button id="reset-all" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded text-sm font-bold transition-all border border-gray-200">
                初期位置に戻す
            </button>
        </div>

        <div class="flex flex-col md:flex-row gap-6">
            <div class="relative bg-slate-50 rounded-lg border border-gray-200 overflow-hidden flex-grow shadow-inner">
                <canvas id="canvas" width="550" height="500" class="w-full h-auto"></canvas>
            </div>

            <div class="w-full md:w-72 space-y-5">
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 text-sm shadow-sm">
                    <h2 class="font-bold text-blue-800 mb-2 border-b border-blue-200 pb-1">力 F</h2>
                    <div class="space-y-1 mt-2">
                        <p>大きさ <span class="math-font">F</span> = <span id="val-f" class="font-mono font-bold text-blue-700 text-lg">0.0</span> N</p>
                        <p>角度 <span class="math-font">θ</span> = <span id="val-theta" class="font-mono font-bold text-blue-700 text-lg">0.0</span>°</p>
                        <p class="text-[10px] text-blue-500 leading-tight">※x'軸を0°とした反時計回りの角度</p>
                    </div>
                </div>

                <div class="bg-green-50 p-4 rounded-lg border border-green-100 text-sm shadow-sm">
                    <h2 class="font-bold text-green-800 mb-2 border-b border-green-200 pb-1">成分分解</h2>
                    <div class="space-y-3 mt-2">
                        <div>
                            <p class="text-red-600 font-bold text-xs tracking-wider uppercase">x'軸方向成分 (F₁)</p>
                            <p class="text-xl font-bold text-red-700">= <span id="res-fx">0.0</span> N</p>
                        </div>
                        <hr class="border-green-200">
                        <div>
                            <p class="text-blue-600 font-bold text-xs tracking-wider uppercase">y'軸方向成分 (F₂)</p>
                            <p class="text-xl font-bold text-blue-700">= <span id="res-fy">0.0</span> N</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center gap-6 sm:gap-8 pt-6 sm:pt-8 border-t border-slate-100">
            <!--//20260810 <div class="flex flex-row gap-3 sm:gap-6 text-[13px] sm:text-sm font-bold">
                <a href="../6.0_home/home.html" class="flex items-center gap-2 px-4 sm:px-8 py-3 sm:py-4 bg-slate-800 text-white rounded-2xl hover:bg-slate-700 transition-colors whitespace-nowrap">

                    物理一覧
                </a>
            </div> //20260810 -->
            <p class="text-[10px] sm:text-[11px] text-slate-400">Copyright &copy; 2021-<span id="current-year"></span> T.Suzuki</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const uiValF = document.getElementById('val-f');
        const uiValTheta = document.getElementById('val-theta');
        const uiResFx = document.getElementById('res-fx');
        const uiResFy = document.getElementById('res-fy');
        document.getElementById('current-year').textContent = new Date().getFullYear();

        let width, height, centerX, centerY;
        const axisLen = 1500; 
        const handlePosX = 230; // x'軸のハンドル位置
        const handlePosY = 205; // y'軸のハンドル位置 (少し内側に配置)
        
        // 初期値: 大きさ 200 (表示 20N), 角度 30度
        let force = { x: 173.2, y: -100 }; 
        let axisXAngle = 0; 
        let axisYAngle = 0.5 * Math.PI; // デフォルトを「上」方向に設定

        let dragTarget = null; 

        function init() {
            width = canvas.width;
            height = canvas.height;
            centerX = width / 2;
            centerY = height / 2;
            draw();
        }

        function solveDecomposition(F_vec, A_unit, B_unit) {
            const det = A_unit.x * B_unit.y - A_unit.y * B_unit.x;
            if (Math.abs(det) < 0.001) return { a: 0, b: 0 }; 
            const a = (F_vec.x * B_unit.y - F_vec.y * B_unit.x) / det;
            const b = (A_unit.x * F_vec.y - A_unit.y * F_vec.x) / det;
            return { a, b };
        }

        function toDeg(rad) {
            let deg = rad * 180 / Math.PI;
            while (deg < 0) deg += 360;
            while (deg >= 360) deg -= 360;
            return deg;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const F_vec = { x: force.x, y: -force.y }; 
            const ux = { x: Math.cos(axisXAngle), y: Math.sin(axisXAngle) };
            const uy = { x: Math.cos(axisYAngle), y: Math.sin(axisYAngle) };

            const comp = solveDecomposition(F_vec, ux, uy);

            // UI Update (値を1/10にして表示)
            const F_mag = Math.sqrt(force.x**2 + force.y**2);
            uiValF.textContent = (F_mag / 10).toFixed(1);
            let absoluteFTheta = Math.atan2(-force.y, force.x);
            let relativeThetaRad = absoluteFTheta - axisXAngle;
            uiValTheta.textContent = toDeg(relativeThetaRad).toFixed(1);
            uiResFx.textContent = (comp.a / 10).toFixed(1);
            uiResFy.textContent = (comp.b / 10).toFixed(1);

            // --- Draw Skewed Grid (黒の細線 - 視認性を向上) ---
            ctx.save();
            ctx.translate(centerX, centerY);
            const gridSize = 40;
            const gridCount = 25;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.14)'; // 視認性を高めた黒
            ctx.lineWidth = 1;
            for (let i = -gridCount; i <= gridCount; i++) {
                ctx.beginPath();
                const ox = i * gridSize * ux.x; const oy = -i * gridSize * ux.y;
                ctx.moveTo(-axisLen * uy.x + ox, axisLen * uy.y + oy);
                ctx.lineTo(axisLen * uy.x + ox, -axisLen * uy.y + oy);
                ctx.stroke();
            }
            for (let j = -gridCount; j <= gridCount; j++) {
                ctx.beginPath();
                const ox = j * gridSize * uy.x; const oy = -j * gridSize * uy.y;
                ctx.moveTo(-axisLen * ux.x + ox, axisLen * ux.y + oy);
                ctx.lineTo(axisLen * ux.x + ox, -axisLen * ux.y + oy);
                ctx.stroke();
            }
            ctx.restore();

            // --- Draw Origin O ---
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 26px san-serif';
            ctx.fillText('O', centerX - 25, centerY + 25);

            // --- Draw Main Axes ---
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = 'rgba(185, 28, 28, 0.5)';
            ctx.beginPath();
            ctx.moveTo(centerX - axisLen * ux.x, centerY + axisLen * ux.y);
            ctx.lineTo(centerX + axisLen * ux.x, centerY - axisLen * ux.y);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(29, 78, 216, 0.5)';
            ctx.beginPath();
            ctx.moveTo(centerX - axisLen * uy.x, centerY + axisLen * uy.y);
            ctx.lineTo(centerX + axisLen * uy.x, centerY - axisLen * uy.y);
            ctx.stroke();

            // Labels (丸のすぐ外側に配置)
            ctx.font = 'bold 22px sans-serif';
            ctx.fillStyle = '#b91c1c';
            ctx.fillText("x'", centerX + (handlePosX + 25) * ux.x, centerY - (handlePosX + 25) * ux.y);
            ctx.fillStyle = '#1d4ed8';
            ctx.fillText("y'", centerX + (handlePosY + 25) * uy.x, centerY - (handlePosY + 25) * uy.y);

            // 補助線
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 5]);
            ctx.beginPath();
            ctx.moveTo(centerX + force.x, centerY + force.y);
            ctx.lineTo(centerX + comp.b * uy.x, centerY - comp.b * uy.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX + force.x, centerY + force.y);
            ctx.lineTo(centerX + comp.a * ux.x, centerY - comp.a * ux.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // ベクトル描画 (太く)
            drawArrow(centerX, centerY, centerX + comp.a * ux.x, centerY - comp.a * ux.y, '#ef4444', 7, 20);
            drawArrow(centerX, centerY, centerX + comp.b * uy.x, centerY - comp.b * uy.y, '#3b82f6', 7, 20);
            drawArrow(centerX, centerY, centerX + force.x, centerY + force.y, '#000000', 9, 26);

            // 操作ハンドル
            ctx.fillStyle = dragTarget === 'force' ? '#6366f1' : '#000000';
            ctx.beginPath(); ctx.arc(centerX + force.x, centerY + force.y, 13, 0, Math.PI*2); ctx.fill();
            const drawH = (angle, color, isT, hPos) => {
                ctx.fillStyle = isT ? color : '#f8fafc';
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(centerX + hPos * Math.cos(angle), centerY - hPos * Math.sin(angle), 11, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(centerX - hPos * Math.cos(angle), centerY + hPos * Math.sin(angle), 11, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            };
            drawH(axisXAngle, '#ef4444', dragTarget === 'axisX', handlePosX);
            drawH(axisYAngle, '#3b82f6', dragTarget === 'axisY', handlePosY);
            
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 28px serif';
            ctx.fillText('F', centerX + force.x + 18, centerY + force.y - 18);
        }

        function drawArrow(fx, fy, tx, ty, color, width, headSize) {
            const angle = Math.atan2(ty - fy, tx - fx);
            ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx - headSize * Math.cos(angle - Math.PI/6), ty - headSize * Math.sin(angle - Math.PI/6));
            ctx.lineTo(tx - headSize * Math.cos(angle + Math.PI/6), ty - headSize * Math.sin(angle + Math.PI/6));
            ctx.closePath();
            ctx.fillStyle = color; ctx.fill();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
        }

        function isOverHandle(pos, angle, hPos) {
            const distPos = Math.hypot(pos.x - (centerX + hPos * Math.cos(angle)), pos.y - (centerY - hPos * Math.sin(angle)));
            const distNeg = Math.hypot(pos.x - (centerX - hPos * Math.cos(angle)), pos.y - (centerY + hPos * Math.sin(angle)));
            return distPos < 35 || distNeg < 35;
        }

        function onDown(e) {
            const pos = getMousePos(e);
            let hit = false;
            if (Math.hypot(pos.x - (centerX + force.x), pos.y - (centerY + force.y)) < 35) { dragTarget = 'force'; hit = true; }
            else if (isOverHandle(pos, axisXAngle, handlePosX)) { dragTarget = 'axisX'; hit = true; }
            else if (isOverHandle(pos, axisYAngle, handlePosY)) { dragTarget = 'axisY'; hit = true; }
            
            // ヒットした場合のみスクロールを防止
            if (hit && e.cancelable) e.preventDefault();
            draw();
        }

        function onMove(e) {
            if (!dragTarget) return;
            const pos = getMousePos(e);
            const dx = pos.x - centerX;
            const dy = centerY - pos.y;
            if (dragTarget === 'force') { force.x = dx; force.y = -dy; }
            else if (dragTarget === 'axisX') { axisXAngle = Math.atan2(dy, dx); }
            else if (dragTarget === 'axisY') { axisYAngle = Math.atan2(dy, dx); }
            if (e.cancelable) e.preventDefault();
            draw();
        }

        function onUp() { dragTarget = null; draw(); }

        canvas.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        canvas.addEventListener('touchstart', onDown, {passive: false});
        canvas.addEventListener('touchmove', onMove, {passive: false});
        canvas.addEventListener('touchend', onUp);

        document.getElementById('make-ortho').onclick = () => { axisYAngle = axisXAngle + Math.PI / 2; draw(); };
        document.getElementById('reset-all').onclick = () => {
            // 初期値に戻す
            force = { x: 173.2, y: -100 };
            axisXAngle = 0;
            axisYAngle = 0.5 * Math.PI; 
            draw();
        };

        window.onload = init;
    </script>
</body>
</html>
