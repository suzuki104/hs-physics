<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天体ごとの重力加速度の違い</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for rendering LaTeX formulas -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        canvas {
            background: #f8fafc;
            border-bottom: 4px solid #64748b;
            /* Allow scrolling even when touching the canvas */
            touch-action: auto;
        }
        /* Style for disabled inputs to make them look inactive */
        input:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-900 flex flex-col">

    <header class="bg-indigo-700 text-white p-4 shadow-lg">
        <h1 class="text-2xl font-bold text-center">天体ごとの重力加速度の違い</h1>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6 flex-grow">
        
        <!-- Combined Simulation Screen -->
        <section class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
            <!-- Status Bar above canvas -->
            <div class="bg-slate-800 text-white px-4 py-2 flex justify-between items-center shadow-inner">
                <div class="flex gap-4 text-xs font-mono">
                    <span class="text-blue-400">球A: <span id="stats-a">0.0m</span></span>
                    <span class="text-emerald-400">球B: <span id="stats-b">0.0m</span></span>
                </div>
                <div class="text-slate-300 text-xs font-mono" id="timer-display">Time: 0.00s</div>
            </div>
            
            <div class="relative">
                <canvas id="main-canvas" class="w-full h-[400px]"></canvas>
                
                <!-- Results Overlay -->
                <div class="absolute top-4 left-4 flex gap-4 pointer-events-none">
                    <div id="results-a" class="text-xs bg-blue-50/90 p-2 rounded border border-blue-200 hidden shadow-sm">
                        <strong class="text-blue-700">球A</strong><br>
                        最大高度: <span id="max-h-a">0</span>m<br>
                        滞空時間: <span id="total-t-a">0</span>s
                    </div>
                    <div id="results-b" class="text-xs bg-emerald-50/90 p-2 rounded border border-emerald-200 hidden shadow-sm">
                        <strong class="text-emerald-700">球B</strong><br>
                        最大高度: <span id="max-h-b">0</span>m<br>
                        滞空時間: <span id="total-t-b">0</span>s
                    </div>
                </div>
            </div>

            <!-- Action Buttons below canvas -->
            <div class="bg-slate-50 p-4 flex justify-center gap-4 border-t border-slate-200">
                <button id="btn-start" class="bg-indigo-600 hover:bg-indigo-700 text-white px-10 py-2.5 rounded-full font-bold shadow-lg transition-all transform hover:scale-105 active:scale-95">
                    打ち出し！
                </button>
                <button id="btn-reset" class="bg-slate-500 hover:bg-slate-600 text-white px-10 py-2.5 rounded-full font-bold shadow-lg transition-all transform hover:scale-105 active:scale-95">
                    リセット
                </button>
            </div>
        </section>

        <!-- Common Initial Velocity Control -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-2">
                <label class="text-sm font-bold text-slate-700 font-serif">初速度 \( v_0 \): <span id="v0-val" class="text-xl text-indigo-600">15</span> m/s</label>
            </div>
            <input type="range" id="v0-common" min="5" max="30" value="15" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
        </div>

        <!-- Gravity Settings Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Settings A -->
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-600">
                <h3 class="font-bold text-blue-700 mb-3 text-sm">球Aの重力設定</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500">天体</label>
                        <select id="preset-a" class="mt-1 block w-full rounded-md border-slate-300 text-sm p-1.5 border">
                            <option value="9.8">地球 (g=9.8)</option>
                            <option value="1.62">月 (g=1.62)</option>
                            <option value="3.7">水星 (g=3.7)</option>
                            <option value="8.87">金星 (g=8.87)</option>
                            <option value="3.71">火星 (g=3.71)</option>
                            <option value="custom">カスタム</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500">重力加速度 \( g \) [m/s²]</label>
                        <input type="text" id="g-a" value="9.8" inputmode="decimal" class="mt-1 block w-full rounded-md border-slate-300 text-sm p-1.5 border" disabled>
                    </div>
                </div>
            </div>

            <!-- Settings B -->
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-600">
                <h3 class="font-bold text-emerald-700 mb-3 text-sm">球Bの重力設定</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500">天体</label>
                        <select id="preset-b" class="mt-1 block w-full rounded-md border-slate-300 text-sm p-1.5 border">
                            <option value="9.8">地球 (g=9.8)</option>
                            <option value="1.62" selected>月 (g=1.62)</option>
                            <option value="3.7">水星 (g=3.7)</option>
                            <option value="8.87">金星 (g=8.87)</option>
                            <option value="3.71">火星 (g=3.71)</option>
                            <option value="custom">カスタム</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500">重力加速度 \( g \) [m/s²]</label>
                        <input type="text" id="g-b" value="1.62" inputmode="decimal" class="mt-1 block w-full rounded-md border-slate-300 text-sm p-1.5 border" disabled>
                    </div>
                </div>
            </div>
        </div>

        <!-- Learning Info -->
        <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm text-indigo-800">
                <ul class="list-disc list-inside space-y-2">
                    <li>重力加速度 \( g \) が小さいほど、速度の変化（加速度の大きさ）が緩やかになり、最高到達点が高くなります。</li>
                </ul>
                <div class="bg-white/70 p-4 rounded border border-indigo-200 shadow-sm">
                    <p class="mb-2 font-bold text-center border-b pb-1 border-indigo-100">鉛直投げ上げ</p>
                    <div class="text-center space-y-2 font-serif">
                        <p>高度: \( y = v_0 t - \frac{1}{2}gt^2 \)</p>
                        <p>速度: \( v = v_0 - gt \)</p>
                        <p>最高点到達時間: \( t = \frac{v_0}{g} \)</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Navigation and Footer -->
    <footer class="mt-8 pb-8 px-4 text-center space-y-6"><!--//20260810 
        <div class="flex justify-center gap-4">
            <a href="../6.0_home/home.html" class="bg-slate-700 hover:bg-slate-800 text-white px-6 py-2 rounded-md font-bold transition-colors">ホーム</a>
            <a href="../6.1_physics_home/physics_home.html" class="bg-slate-700 hover:bg-slate-800 text-white px-6 py-2 rounded-md font-bold transition-colors">物理一覧</a>
        </div> //20260810 -->
        <div class="text-slate-500 text-xs">
            Copyright &copy; 2021-<span id="current-year"></span> T.Suzuki
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const timerDisplay = document.getElementById('timer-display');
        const btnReset = document.getElementById('btn-reset');
        
        // Set current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // State management
        const state = {
            running: false,
            startTime: 0,
            scale: 1.0,
            commonV0: 15,
            ballA: { id: 'a', color: '#2563eb', g: 9.8, y: 0, v: 15, active: false, planetName: '地球' },
            ballB: { id: 'b', color: '#059669', g: 1.62, y: 0, v: 15, active: false, planetName: '月' }
        };

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 400;
            draw();
        }
        window.addEventListener('resize', resize);
        resize();

        function updateInputs() {
            // Auto-reset if interaction happens while running
            if (state.running) {
                btnReset.click();
                return;
            }

            state.commonV0 = parseFloat(document.getElementById('v0-common').value) || 0;
            document.getElementById('v0-val').textContent = state.commonV0;

            const ga = parseFloat(document.getElementById('g-a').value);
            const gb = parseFloat(document.getElementById('g-b').value);
            
            // Safety guard for invalid/empty numbers
            state.ballA.g = isNaN(ga) ? 9.8 : ga;
            state.ballB.g = isNaN(gb) ? 9.8 : gb;

            // Update planet names for display on ground
            const updateLabel = (ball, suffix) => {
                const select = document.getElementById(`preset-${suffix}`);
                // Use the exact value from the input/state for display
                const gValue = ball.g;
                
                if (select.value === 'custom') {
                    ball.planetName = `カスタム (g=${gValue}m/s²)`;
                } else {
                    const baseName = select.options[select.selectedIndex].text.split(' (')[0];
                    ball.planetName = `${baseName} (g=${gValue}m/s²)`;
                }
            };
            updateLabel(state.ballA, 'a');
            updateLabel(state.ballB, 'b');

            if (!state.running) {
                state.ballA.v = state.commonV0;
                state.ballB.v = state.commonV0;
            }

            // Calculate scale based on max height potential (avoid division by zero)
            const hA = state.ballA.g > 0 ? (state.commonV0**2) / (2 * state.ballA.g) : 0;
            const hB = state.ballB.g > 0 ? (state.commonV0**2) / (2 * state.ballB.g) : 0;
            const maxH = Math.max(hA, hB, 10);
            
            state.scale = (canvas.height - 120) / maxH;

            if (!state.running) draw();
        }

        // Helper to convert full-width numbers to half-width
        function toHalfWidth(str) {
            return str.replace(/[０-９．]/g, (s) => {
                if (s === '．') return '.';
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });
        }

        // Draw Arrow to the side of the ball
        function drawArrow(ballX, ballY, velocity) {
            const arrowBaseX = ballX + 25; // Offset to the right
            const arrowLen = velocity * 4; 
            if (isNaN(arrowLen) || Math.abs(arrowLen) < 0.5) return;

            ctx.beginPath();
            ctx.strokeStyle = velocity >= 0 ? '#ef4444' : '#f97316'; // Red for up, Orange for down
            ctx.lineWidth = 3;
            
            const endY = ballY - arrowLen;
            ctx.moveTo(arrowBaseX, ballY);
            ctx.lineTo(arrowBaseX, endY);
            
            // Arrow head
            const headSize = 8;
            const angle = velocity >= 0 ? 1 : -1;
            ctx.lineTo(arrowBaseX - headSize/2, endY + headSize * angle);
            ctx.moveTo(arrowBaseX, endY);
            ctx.lineTo(arrowBaseX + headSize/2, endY + headSize * angle);
            ctx.stroke();

            // Label near the arrow
            ctx.fillStyle = ctx.strokeStyle;
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`v=${velocity.toFixed(1)}`, arrowBaseX + 10, endY + (velocity >= 0 ? 0 : 10));
        }

        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const groundY = h - 60; // 少し上げて文字のスペースを確保

            ctx.clearRect(0, 0, w, h);

            // Draw Scale/Grid
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.font = '10px sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'left';
            
            const minG = Math.min(state.ballA.g, state.ballB.g);
            const step = (minG > 0 && (state.commonV0**2 / (2 * minG)) > 100) ? 50 : 10;
            for (let i = 0; i <= 100; i++) {
                const meters = i * step;
                const yPos = groundY - (meters * state.scale);
                if (yPos < 0 || isNaN(yPos)) break;
                ctx.beginPath();
                ctx.moveTo(45, yPos);
                ctx.lineTo(w, yPos);
                ctx.stroke();
                ctx.fillText(`${meters}m`, 5, yPos + 3);
            }

            // Draw Ground
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(0, groundY, w, 60); // 地面を厚くして文字が収まるようにする

            // Draw Ball Helper
            const drawBall = (ball, xOffset) => {
                const ballX = w/2 + xOffset;
                const ballY = groundY - (ball.y * state.scale);
                
                // Final safety check for rendering coordinates
                if (isNaN(ballX) || isNaN(ballY)) return;

                // Planet Name Label on ground (larger font and lower position)
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 16px sans-serif'; // 少しだけサイズを調整して情報量を収める
                ctx.textAlign = 'center';
                ctx.fillText(ball.planetName, ballX, groundY + 35);

                // Shadow
                ctx.beginPath();
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.ellipse(ballX, groundY + 5, 12, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Velocity Vector (now to the side)
                drawArrow(ballX, ballY, ball.v);

                // Ball
                ctx.beginPath();
                ctx.arc(ballX, ballY, 15, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(ballX-5, ballY-5, 3, ballX, ballY, 15);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(1, ball.color);
                ctx.fillStyle = grad;
                ctx.fill();
            };

            drawBall(state.ballA, -100);
            drawBall(state.ballB, 60);
        }

        function startSim() {
            if (state.running) return;
            state.running = true;
            state.startTime = performance.now();
            state.ballA.active = true;
            state.ballB.active = true;

            const setupResults = (ball) => {
                if (ball.g <= 0) return;
                const id = ball.id;
                document.getElementById(`max-h-${id}`).textContent = ((state.commonV0**2)/(2*ball.g)).toFixed(1);
                document.getElementById(`total-t-${id}`).textContent = ((2*state.commonV0)/ball.g).toFixed(2);
                document.getElementById(`results-${id}`).classList.remove('hidden');
            };
            setupResults(state.ballA);
            setupResults(state.ballB);

            requestAnimationFrame(animate);
        }

        function animate(now) {
            if (!state.running) return;

            const elapsed = (now - state.startTime) / 1000;
            timerDisplay.textContent = `Time: ${elapsed.toFixed(2)}s`;

            [state.ballA, state.ballB].forEach(ball => {
                if (!ball.active) return;
                
                ball.y = state.commonV0 * elapsed - 0.5 * ball.g * elapsed * elapsed;
                ball.v = state.commonV0 - ball.g * elapsed;

                if (ball.y <= 0 && elapsed > 0.1) {
                    ball.y = 0;
                    ball.v = 0;
                    ball.active = false;
                }
                document.getElementById(`stats-${ball.id}`).textContent = `${ball.y.toFixed(1)}m`;
            });

            draw();

            if (state.ballA.active || state.ballB.active) {
                requestAnimationFrame(animate);
            } else {
                state.running = false;
            }
        }

        // Event Listeners
        document.getElementById('btn-start').onclick = startSim;
        btnReset.onclick = () => {
            state.running = false;
            state.ballA.y = 0;
            state.ballB.y = 0;
            state.ballA.v = state.commonV0;
            state.ballB.v = state.commonV0;
            document.getElementById('results-a').classList.add('hidden');
            document.getElementById('results-b').classList.add('hidden');
            timerDisplay.textContent = "Time: 0.00s";
            document.getElementById(`stats-a`).textContent = "0.0m";
            document.getElementById(`stats-b`).textContent = "0.0m";
            updateInputs();
        };

        // Inputs
        document.getElementById('v0-common').oninput = updateInputs;
        
        ['a', 'b'].forEach(suffix => {
            const presetEl = document.getElementById(`preset-${suffix}`);
            const gEl = document.getElementById(`g-${suffix}`);
            
            presetEl.onchange = (e) => {
                if (e.target.value !== 'custom') {
                    gEl.value = e.target.value;
                    gEl.disabled = true; // Disable input for presets
                } else {
                    gEl.disabled = false; // Enable only for custom
                }
                updateInputs();
            };
            gEl.oninput = () => {
                updateInputs();
            };
            
            // Common cleanup function for full-width to half-width conversion and validation
            const cleanInput = (input) => {
                // 1. 全角を半角に変換
                let valStr = toHalfWidth(input.value);
                
                // 2. 数値としてパース
                let valNum = parseFloat(valStr);
                
                // 3. バリデーション: マイナス値なら0に変換、または数値以外ならデフォルトに戻す
                if (isNaN(valNum)) {
                    valNum = 0;
                } else if (valNum < 0) {
                    valNum = 0;
                }
                
                // 入力欄に反映
                input.value = valNum;
                updateInputs();
            };

            // Handle focus out
            gEl.onblur = (e) => {
                cleanInput(e.target);
            };

            // Handle Enter key press
            gEl.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    cleanInput(e.target);
                }
            };
        });

        // Initial setup
        updateInputs();
    </script>
</body>
</html>
