<body>
<div class='canvas_body'>
  <h1 class="canvas_title"> モンキーハンティング </h1>
    初期位置と初速度をスライダーより選択<br>
<div class='table'>
<table border="1">
<tr><!--0-->
  <td colspan="4">
    パラメータ入力欄
  </td>
</tr>
<tr><!--1-->
  <td colspan="2">
  </td>
  <td>
    左右<!--x軸-->
  </td>
  <td>
    高さ<!--y軸-->
  </td>
</tr>
<tr><!--2-->
  <td rowspan="2">
    初期位置
  </td>
  <td bgcolor='red'>
    赤球
  </td>
  <td><!--赤球x軸初期位置-->
      左<input type='range' id='x1pos' name= 'x1pos' value='10' min='1' max='500'>右
  </td>
  <td><!--赤球y軸初期位置-->
  高<input type='range' id='y1pos' name= 'y1pos' value='490' min='1' max='500'>低
  </td>
</tr>
<tr><!--3-->
  <td bgcolor='skyblue'>
    青球
  </td>
  <td><!--青球x軸初期位置-->
    左<input type='range' id='x2pos' name= 'x2pos' value='450' min='1' max='500'>右
  </td>
  <td><!--青球y軸初期位置-->
    高<input type='range' id='y2pos' name= 'y2pos' value='10' min='1' max='500'>低
  </td>
</tr>
<tr><!--4-->
  <td colspan="2">
    初速度（赤球）
  </td>
  <td colspan="2"><!--赤球初速度-->
    遅<input type='range' id='i_velocity' name= 'i_velocity' value='100' min='1' max='500'>速 <!--初速度最大値設定したのは特に意味はない-->
  </td>
</tr>

</table>
</div><br> <!--table-->

 <input type='number' id='i_velocity' name= 'i_velocity' value='100' min='0'> <br>

    <label for= 'y2pos'>&nbsp;y軸 </label>
