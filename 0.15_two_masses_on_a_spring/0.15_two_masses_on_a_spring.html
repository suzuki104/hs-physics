<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2つの物体とばねによる落下運動</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            touch-action: pan-y;
        }
        .custom-range {
            height: 6px;
            background: #e2e8f0;
            border-radius: 5px;
            outline: none;
            transition: opacity .2s;
        }
        @media (max-width: 1023px) {
            #simCanvas {
                max-height: 300px;
                object-fit: contain;
            }
        }
    </style>
</head>
<body class="min-h-screen p-2 md:p-4">

    <div class="max-w-[1600px] mx-auto">
        <header class="mb-4 text-center">
            <h1 class="text-2xl font-extrabold text-slate-900 mb-1">縮まない2つのばねと2つの物体による落下運動</h1>
            <p class="text-sm text-slate-600 mb-2">ばねの質量が無視できないときの落下運動のモデル</p>
            
            <div class="flex flex-row gap-4 max-w-sm mx-auto">
                <button id="playPauseBtn" class="flex-1 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:scale-95 transition-all shadow-md font-bold flex items-center justify-center gap-2 text-sm">
                    <span id="btnIcon">▶</span> <span id="btnText">落下開始</span>
                </button>
                <button id="resetBtn" class="flex-1 py-2 bg-white text-slate-700 border border-slate-300 rounded-xl hover:bg-slate-50 active:scale-95 transition-all font-bold shadow-sm text-sm">
                    リセット
                </button>
            </div>
        </header>

        <!-- 3-column layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-3">
            
            <!-- Left Column: Animation -->
            <div class="lg:col-span-3">
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 h-full flex items-center justify-center">
                    <canvas id="simCanvas" width="300" height="600" class="w-full h-auto border-none shadow-none"></canvas>
                </div>
            </div>

            <!-- Middle Column: Graphs -->
            <div class="lg:col-span-6">
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 h-full">
                    <div class="flex flex-wrap items-center gap-4 mb-2 px-2">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" id="showObj1Graph" checked class="w-3 h-3 rounded border-slate-300 text-red-600 focus:ring-red-500">
                            <span class="text-[10px] font-bold text-red-700">おもり1 (Red)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" id="showObj2Graph" checked class="w-3 h-3 rounded border-slate-300 text-green-600 focus:ring-green-500">
                            <span class="text-[10px] font-bold text-green-700">おもり2 (Green)</span>
                        </label>
                    </div>
                    <canvas id="graphCanvas" width="800" height="650" class="w-full h-auto bg-slate-50"></canvas>
                </div>
            </div>

            <!-- Right Column: Numeric Display & Controls -->
            <div class="lg:col-span-3 flex flex-col gap-3">
                <!-- Data Display -->
                <div class="bg-slate-800 text-slate-100 p-4 rounded-2xl shadow-lg">
                    <div class="flex justify-end items-center mb-2">
                        <div class="font-bold text-emerald-400 font-mono text-lg">
                            <span id="timeVal">0.00</span><span class="text-xs ml-1">s</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-1 gap-2">
                        <div class="p-2 bg-slate-700/50 rounded-xl border border-slate-600">
                            <p class="text-red-400 text-[10px] font-bold mb-1 border-b border-slate-600 pb-1">おもり1 (上段)</p>
                            <div class="flex justify-between text-[11px] mb-0.5"><span>変位:</span><span id="y1Val" class="font-bold">0.00</span> m</div>
                            <div class="flex justify-between text-[11px] mb-0.5"><span>速度:</span><span id="v1Val" class="font-bold">0.00</span> m/s</div>
                            <div class="flex justify-between text-[11px] mb-0.5"><span>加速度:</span><span id="a1Val" class="font-bold">0.00</span> m/s²</div>
                        </div>
                        <div class="p-2 bg-slate-700/50 rounded-xl border border-slate-600">
                            <p class="text-green-400 text-[10px] font-bold mb-1 border-b border-slate-600 pb-1">おもり2 (下段)</p>
                            <div class="flex justify-between text-[11px] mb-0.5"><span>変位:</span><span id="y2Val" class="font-bold">0.00</span> m</div>
                            <div class="flex justify-between text-[11px] mb-0.5"><span>速度:</span><span id="v2Val" class="font-bold">0.00</span> m/s</div>
                            <div class="flex justify-between text-[11px] mb-0.5"><span>加速度:</span><span id="a2Val" class="font-bold">0.00</span> m/s²</div>
                        </div>
                    </div>
                </div>

                <!-- Sliders -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col gap-4">
                    <div class="space-y-2">
                        <div class="flex justify-between mb-0.5 text-[11px]">
                            <label class="font-semibold text-slate-700">ばね定数 (k)</label>
                            <span class="text-indigo-600 font-mono font-bold"><span id="kVal">20</span> N/m</span>
                        </div>
                        <input type="range" id="kInput" min="5" max="50" value="20" class="w-full custom-range">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between mb-0.5 text-[11px]">
                            <label class="font-semibold text-slate-700">質量 m1 (上)</label>
                            <span class="text-indigo-600 font-mono font-bold"><span id="m1ValText">4.0</span> kg</span>
                        </div>
                        <input type="range" id="m1Input" min="0.1" max="20.0" step="0.1" value="4.0" class="w-full custom-range">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between mb-0.5 text-[11px]">
                            <label class="font-semibold text-slate-700">質量 m2 (下)</label>
                            <span class="text-indigo-600 font-mono font-bold"><span id="m2ValText">5.0</span> kg</span>
                        </div>
                        <input type="range" id="m2Input" min="0.1" max="20.0" step="0.1" value="5.0" class="w-full custom-range">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between mb-0.5 text-[11px]">
                            <label class="font-semibold text-slate-700">再生速度</label>
                            <span class="text-indigo-600 font-mono font-bold"><span id="speedVal">1.00</span>x</span>
                        </div>
                        <input type="range" id="speedInput" min="0.01" max="1.0" step="0.01" value="1.00" class="w-full custom-range">
                    </div>
                    
                    <div class="mt-auto pt-2 border-t border-slate-100">
                        <p class="text-[9px] text-slate-400 leading-tight italic">
                            ※シミュレーションは支点の微小質量(0.001kg)を考慮しています。
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-8 py-6 border-t border-slate-200">
            <div class="flex justify-center gap-4 mb-4">
                <!--//20260810<a href="../6.0_home/home.html" class="px-6 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition-colors font-bold text-sm">ホーム</a>
                <a href="../6.1_physics_home/physics_home.html" class="px-6 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition-colors font-bold text-sm">物理一覧</a>
            //20260810--></div>
            <div class="text-center">
                <p class="text-slate-400 text-xs" id="copyright"></p>
            </div>
        </footer>
    </div>

    <script>
        document.getElementById('copyright').innerHTML = `Copyright &copy; 2021-${new Date().getFullYear()} T.Suzuki`;

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const gctx = graphCanvas.getContext('2d');
        
        const y1Display = document.getElementById('y1Val');
        const v1Display = document.getElementById('v1Val');
        const a1Display = document.getElementById('a1Val');
        const y2Display = document.getElementById('y2Val');
        const v2Display = document.getElementById('v2Val');
        const a2Display = document.getElementById('a2Val');
        const timeDisplay = document.getElementById('timeVal');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');

        const showObj1Graph = document.getElementById('showObj1Graph');
        const showObj2Graph = document.getElementById('showObj2Graph');

        // Physics constants
        let k1 = 20, k2 = 20;
        let m1 = 4.0, m2 = 5.0;
        const m_spring = 0.001; 
        let simSpeed = 1.0; 
        const g = 9.8;
        const ppi = 45; 
        
        const ceilingY_m = 0.3;
        const L1 = 0.8, L2 = 0.8; 
        
        // State
        let springTopY = ceilingY_m; 
        let y1 = 0, y2 = 0; 
        let v_top = 0, v1 = 0, v2 = 0;
        let a_top = 0, a1 = 0, a2 = 0;
        let isRunning = false;
        let isAttached = true; 
        let elapsedSimTime = 0;
        const maxTimeOnGraph = 10.0;
        let history = [];

        const kInput = document.getElementById('kInput');
        const m1Input = document.getElementById('m1Input');
        const m2Input = document.getElementById('m2Input');
        const speedInput = document.getElementById('speedInput');

        function getRadius(m) {
            const baseRadius = 8;
            const r = baseRadius * Math.pow(m, 1/3);
            return Math.min(Math.max(r, 6), 25);
        }

        function initSystem() {
            isAttached = true;
            springTopY = ceilingY_m;
            const stretch1 = (m1 + m2) * g / k1;
            const stretch2 = m2 * g / k2;
            
            y1 = springTopY + L1 + stretch1;
            y2 = y1 + L2 + stretch2;
            v_top = 0; v1 = 0; v2 = 0;
            a_top = 0; a1 = 0; a2 = 0;
            elapsedSimTime = 0;
            history = [];
            
            btnIcon.innerText = "▶";
            btnText.innerText = "落下開始";
            updateDisplay();
        }

        function updateDisplay() {
            y1Display.innerText = Math.max(0, (y1 - ceilingY_m)).toFixed(3);
            v1Display.innerText = v1.toFixed(3);
            a1Display.innerText = a1.toFixed(2);
            y2Display.innerText = Math.max(0, (y2 - ceilingY_m)).toFixed(3);
            v2Display.innerText = v2.toFixed(3);
            a2Display.innerText = a2.toFixed(2);
            timeDisplay.innerText = elapsedSimTime.toFixed(2);
        }

        kInput.addEventListener('input', (e) => { 
            k1 = k2 = parseFloat(e.target.value); 
            document.getElementById('kVal').innerText = k1;
            if(isAttached) initSystem(); 
        });
        m1Input.addEventListener('input', (e) => { 
            m1 = parseFloat(e.target.value); 
            document.getElementById('m1ValText').innerText = m1.toFixed(1);
            if(isAttached) initSystem(); 
        });
        m2Input.addEventListener('input', (e) => { 
            m2 = parseFloat(e.target.value); 
            document.getElementById('m2ValText').innerText = m2.toFixed(1);
            if(isAttached) initSystem(); 
        });
        speedInput.addEventListener('input', (e) => { 
            simSpeed = parseFloat(e.target.value); 
            document.getElementById('speedVal').innerText = simSpeed.toFixed(2);
        });

        playPauseBtn.addEventListener('click', () => {
            if (!isRunning && isAttached) {
                isAttached = false; 
            }
            isRunning = !isRunning;
            if (isRunning) {
                btnIcon.innerText = "⏸";
                btnText.innerText = "一時停止";
            } else {
                btnIcon.innerText = "▶";
                btnText.innerText = "再開";
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isRunning = false;
            initSystem();
        });

        function drawSpring(yTop, yBottom, naturalLength_m, color = '#64748b') {
            const coils = 15;
            const width = 8;
            const centerX = canvas.width / 2;
            let currentLength = yBottom - yTop;
            const naturalLength_px = naturalLength_m * ppi;
            const drawLength = Math.max(currentLength, naturalLength_px);
            
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.0;
            ctx.moveTo(centerX, yTop);
            for (let i = 0; i <= coils; i++) {
                const fraction = i / coils;
                const currY = yTop + fraction * drawLength;
                const currX = centerX + (i % 2 === 0 ? width : -width) * (i === 0 || i === coils ? 0 : 1);
                ctx.lineTo(currX, currY);
            }
            ctx.stroke();
        }

        function drawGraph() {
            gctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            const padding = 50;
            const gWidth = graphCanvas.width - padding * 2;
            const paneHeight = (graphCanvas.height - padding * 4) / 3;
            const scaleT = gWidth / maxTimeOnGraph;

            const panes = [
                { title: "変位 y (m)", props: ["y1_rel", "y2_rel"], colors: ["#ef4444", "#22c55e"] },
                { title: "速度 v (m/s)", props: ["v1", "v2"], colors: ["#ef4444", "#22c55e"] },
                { title: "加速度 a (m/s²)", props: ["a1", "a2"], colors: ["#ef4444", "#22c55e"] }
            ];

            panes.forEach((pane, idx) => {
                const topY = padding + (paneHeight + padding) * idx;
                const bottomY = topY + paneHeight;

                gctx.strokeStyle = '#e2e8f0';
                gctx.lineWidth = 1;
                gctx.beginPath();
                gctx.moveTo(padding, topY); gctx.lineTo(padding, bottomY);
                gctx.lineTo(graphCanvas.width - padding, bottomY);
                gctx.stroke();
                
                gctx.fillStyle = '#1e293b';
                gctx.font = 'bold 16px sans-serif';
                gctx.fillText(pane.title, padding, topY - 12);

                if (history.length < 2) return;

                const activeData = [];
                if (showObj1Graph.checked) activeData.push(...history.map(d => d[pane.props[0]]));
                if (showObj2Graph.checked) activeData.push(...history.map(d => d[pane.props[1]]));
                
                if (activeData.length === 0) return;
                let minV = Math.min(0, ...activeData);
                let maxV = Math.max(0.1, ...activeData);
                const scaleY = paneHeight / ((maxV - minV) * 1.2 || 1);
                const zeroY = bottomY + minV * scaleY;

                gctx.setLineDash([3, 3]);
                gctx.strokeStyle = '#cbd5e1';
                gctx.beginPath();
                gctx.moveTo(padding, zeroY);
                gctx.lineTo(graphCanvas.width - padding, zeroY);
                gctx.stroke();
                gctx.setLineDash([]);

                const drawLine = (prop, color) => {
                    gctx.beginPath();
                    gctx.strokeStyle = color;
                    gctx.lineWidth = 3;
                    history.forEach((pt, i) => {
                        if (pt.t > maxTimeOnGraph) return;
                        const x = padding + pt.t * scaleT;
                        const y = zeroY - pt[prop] * scaleY;
                        if (i === 0) gctx.moveTo(x, y); else gctx.lineTo(x, y);
                    });
                    gctx.stroke();
                };

                if (showObj1Graph.checked) drawLine(pane.props[0], pane.colors[0]);
                if (showObj2Graph.checked) drawLine(pane.props[1], pane.colors[1]);
                
                if (idx === 2) {
                    gctx.fillStyle = '#64748b';
                    gctx.font = '14px monospace';
                    gctx.textAlign = 'right';
                    gctx.fillText("10.0s", graphCanvas.width - padding, bottomY + 20);
                }
            });
        }

        function update() {
            if (isRunning) {
                const dt = 0.016 * simSpeed;
                const subSteps = 10;
                const sdt = dt / subSteps;

                for(let s=0; s<subSteps; s++) {
                    elapsedSimTime += sdt;
                    let stretch1 = Math.max(0, (y1 - springTopY) - L1);
                    let stretch2 = Math.max(0, (y2 - y1) - L2);
                    const f1 = k1 * stretch1; 
                    const f2 = k2 * stretch2; 

                    if (isAttached) {
                        a_top = 0; v_top = 0; springTopY = ceilingY_m;
                    } else {
                        a_top = g; 
                        v_top += a_top * sdt;
                        springTopY += v_top * sdt;
                    }

                    a1 = g + (-f1 + f2) / m1;
                    v1 += a1 * sdt;
                    y1 += v1 * sdt;

                    a2 = g - f2 / m2;
                    v2 += a2 * sdt;
                    y2 += v2 * sdt;

                    if (y1 < springTopY + L1) { y1 = springTopY + L1; if (v1 < v_top) v1 = v_top; }
                    if (y2 < y1 + L2) { y2 = y1 + L2; if (v2 < v1) v2 = v1; }
                }

                history.push({
                    t: elapsedSimTime,
                    y1_rel: y1 - ceilingY_m,
                    y2_rel: y2 - ceilingY_m,
                    v1, v2, a1, a2
                });

                if (elapsedSimTime > maxTimeOnGraph) isRunning = false;
                updateDisplay();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const ty = springTopY * ppi;
            const p1 = y1 * ppi;
            const p2 = y2 * ppi;

            ctx.fillStyle = isAttached ? '#334155' : '#cbd5e1';
            ctx.fillRect(cx - 50, (ceilingY_m * ppi) - 6, 100, 6);

            ctx.beginPath();
            ctx.arc(cx, ty, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#3b82f6';
            ctx.fill();

            drawSpring(ty, p1, L1, '#64748b');
            drawSpring(p1, p2, L2, '#94a3b8');

            const r1 = getRadius(m1);
            const r2 = getRadius(m2);

            ctx.beginPath(); ctx.arc(cx, p1, r1, 0, Math.PI*2);
            ctx.fillStyle = '#ef4444'; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, p2, r2, 0, Math.PI*2);
            ctx.fillStyle = '#22c55e'; ctx.fill(); ctx.stroke();

            drawGraph();
            requestAnimationFrame(update);
        }

        initSystem();
        requestAnimationFrame(update);
    </script>
</body>
</html>
