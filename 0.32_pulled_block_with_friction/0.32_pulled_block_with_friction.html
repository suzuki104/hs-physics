<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摩擦のある床上で糸に引かれる物体の運動</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas {
            background-color: #f8fafc;
            border-bottom: 2px solid #64748b;
            /* touch-action: none; を削除してスクロールを許可 */
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 text-gray-800">

    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Header: 白背景・黒文字に変更 -->
        <div class="bg-white border-b border-gray-200 p-6 text-gray-900 text-center">
            <h1 class="text-3xl font-bold">摩擦のある床上で糸に引かれる物体の運動</h1>
        </div>

        <!-- Controls Upper (Buttons) -->
        <div class="p-6 space-y-4 border-b border-gray-100">
            <button id="toggleVectorBtn" class="w-full border-4 border-blue-600 text-blue-600 font-bold text-2xl py-4 rounded-xl hover:bg-blue-50 transition">
                作図を表示
            </button>
            <div class="flex gap-4">
                <button id="startBtn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold text-2xl py-6 rounded-xl shadow-md transition">
                    スタート
                </button>
                <button id="resetBtn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold text-2xl py-6 rounded-xl shadow-md transition">
                    リセット
                </button>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="relative">
            <canvas id="simCanvas" class="w-full h-80"></canvas>
            <div id="velocityDisplay" class="absolute top-4 left-4 bg-black/70 text-white px-4 py-2 rounded-lg text-xl font-bold">
                速度: 0.0 m/s
            </div>
        </div>

        <!-- Controls Lower (Sliders) -->
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8 border-b border-gray-100">
            <!-- Left Column -->
            <div class="space-y-6">
                <div>
                    <div class="slider-label">
                        <span>初速度 (v₀)</span>
                        <span id="initVVal">12.0 m/s</span>
                    </div>
                    <input type="range" id="initVRange" min="0" max="20" step="0.5" value="12" class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <div class="slider-label">
                        <span>張力の大きさ (T)</span>
                        <span id="tensionVal">15 N</span>
                    </div>
                    <input type="range" id="tensionRange" min="5" max="100" step="1" value="15" class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
            <!-- Right Column -->
            <div class="space-y-6">
                <div>
                    <div class="slider-label">
                        <span>動摩擦力の大きさ (f')</span>
                        <span id="frictionVal">10 N</span>
                    </div>
                    <input type="range" id="frictionRange" min="0" max="100" step="1" value="10" class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="flex items-center justify-center h-full pt-6">
                    <!-- 質量表示のテキストを削除しました -->
                </div>
            </div>
        </div>

        <!-- Info & Navigation -->
        <div class="p-6 border-b border-gray-100">
            <div class="text-lg text-gray-600 bg-gray-100 p-4 rounded-lg border-l-8 border-gray-300">
                <p>※初速度の向きは右向きに設定されています。張力の大きさが動摩擦力の大きさよりも大きくなるように、パラメータが制限されています。</p>
            </div>
        </div>

        <!-- Footer Buttons & Copyright -->
        <div class="p-8 text-center space-y-6">
            <div class="flex justify-center gap-8">
                <!--//20260810
                <a href="../6.0_home/home.html" class="bg-gray-700 hover:bg-gray-800 text-white px-10 py-3 rounded-xl text-xl font-bold transition">
                    ホーム
                </a>
                <a href="../6.1_physics_home/physics_home.html" class="bg-gray-700 hover:bg-gray-800 text-white px-10 py-3 rounded-xl text-xl font-bold transition">
                    物理一覧
                </a>//20260810-->
            </div>
            <div class="text-gray-400 text-lg py-2">
                Copyright &copy; 2021-<span id="currentYear"></span> T.Suzuki
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const velocityDisplay = document.getElementById('velocityDisplay');
        const currentYearSpan = document.getElementById('currentYear');
        currentYearSpan.textContent = new Date().getFullYear();

        // UI Elements
        const initVRange = document.getElementById('initVRange');
        const initVVal = document.getElementById('initVVal');
        const tensionRange = document.getElementById('tensionRange');
        const frictionRange = document.getElementById('frictionRange');
        const tensionVal = document.getElementById('tensionVal');
        const frictionVal = document.getElementById('frictionVal');
        const resetBtn = document.getElementById('resetBtn');
        const startBtn = document.getElementById('startBtn');
        const toggleVectorBtn = document.getElementById('toggleVectorBtn');

        // Constants & State
        const g = 9.8;
        const scale = 50; 
        let showVectors = false;
        let isRunning = false;
        let isStarted = false; 
        let initialV = 12.0;
        
        let obj = {
            x: 100,
            y: 0,
            width: 100, 
            height: 80, 
            v: 12.0,      
            a: 0,      
            mass: 3.0, 
            tension: 15,
            frictionForceValue: 10 
        };

        const initialX = 100;

        function init() {
            updateSliderConstraints();
            resize();
            window.addEventListener('resize', resize);
            requestAnimationFrame(update);
        }

        function resize() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = 320; 
            obj.y = canvas.height - 120; 
        }

        // 張力の大きさが動摩擦力の大きさよりも大きくなる（必ず上回る）ように制約をかける
        function updateSliderConstraints() {
            // f' が T を下回るようにスライダーの最大値を設定 (f' < T)
            const maxFriction = obj.tension - 1;
            frictionRange.max = maxFriction.toString();
            
            if (obj.frictionForceValue > maxFriction) {
                obj.frictionForceValue = maxFriction;
                frictionRange.value = obj.frictionForceValue;
                frictionVal.innerText = `${obj.frictionForceValue} N`;
            }
        }

        function autoReset() {
            if (isStarted || isRunning) {
                resetSimulation();
            }
        }

        function resetSimulation() {
            obj.x = initialX;
            obj.v = initialV;
            isRunning = false;
            isStarted = false;
            startBtn.innerText = "スタート";
            startBtn.className = "flex-1 bg-green-500 hover:bg-green-600 text-white font-bold text-2xl py-6 rounded-xl shadow-md transition";
        }

        function update() {
            if (isRunning) {
                const tensionForce = obj.tension;
                
                let currentFriction = 0;
                if (Math.abs(obj.v) > 0.01) {
                    const direction = obj.v > 0 ? 1 : -1;
                    currentFriction = obj.frictionForceValue * -direction;
                }

                const netForce = (-tensionForce) + currentFriction;
                obj.a = netForce / obj.mass;

                obj.v += obj.a * (1/60);
                obj.x += obj.v * scale * (1/60);
            }

            draw();
            velocityDisplay.innerText = `速度: ${obj.v.toFixed(2)} m/s`;
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const floorY = obj.y + obj.height;

            // Draw Ground
            if (obj.frictionForceValue > 0) {
                ctx.fillStyle = '#cbd5e1'; 
                ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
                
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                for(let x = -canvas.height; x < canvas.width; x += 15) {
                    ctx.beginPath();
                    ctx.moveTo(x, floorY);
                    ctx.lineTo(x + (canvas.height - floorY), canvas.height);
                    ctx.stroke();
                }
            }

            // Draw Floor Line
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Draw String
            const stringLength = obj.width * 2.5;
            const stringLeftX = obj.x - stringLength;
            const stringY = obj.y + obj.height/2;

            ctx.beginPath();
            ctx.moveTo(obj.x, stringY);
            ctx.lineTo(stringLeftX, stringY);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw Hand (一回り大きく調整)
            const rectHeight = 15; // 11.25 -> 15
            const rectWidth = 50;  // 40 -> 50
            const circleRadius = 11; // 8 -> 11
            ctx.fillStyle = '#e2e8f0';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.fillRect(stringLeftX - rectWidth, stringY - rectHeight/2, rectWidth, rectHeight);
            ctx.strokeRect(stringLeftX - rectWidth, stringY - rectHeight/2, rectWidth, rectHeight);

            ctx.beginPath();
            ctx.arc(stringLeftX, stringY, circleRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.stroke();

            // Draw Object
            ctx.fillStyle = '#7dd3fc'; 
            ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
            ctx.strokeStyle = '#0369a1';
            ctx.lineWidth = 3;
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);

            drawVelocityVector();

            if (showVectors) {
                drawVectors();
            }
        }

        function drawVelocityVector() {
            const centerX = obj.x + obj.width / 2;
            const centerY = obj.y - 100; 
            const vLen = obj.v * 15; 
            
            if (Math.abs(obj.v) > 0.05) {
                const label = isStarted ? '速度 v' : '初速度 v₀';
                drawArrow(centerX, centerY, centerX + vLen, centerY, '#0ea5e9', label, true);
            }
        }

        function drawVectors() {
            const centerX = obj.x + obj.width / 2;
            const centerY = obj.y + obj.height / 2;
            
            const forceScale = 2.5; 
            const gravityLen = obj.mass * g * forceScale;
            const tensionLen = obj.tension * forceScale;
            const frictionLen = obj.frictionForceValue * forceScale;

            // 1. Gravity (W)
            drawArrow(centerX, centerY, centerX, centerY + gravityLen, '#ef4444', '重力 W');
            
            // 2. Normal Force (N)
            drawArrow(centerX, centerY, centerX, centerY - gravityLen, '#10b981', '垂直抗力 N');

            // 3. Tension (T)
            drawArrow(obj.x, centerY, obj.x - tensionLen, centerY, '#f59e0b', '張力 T', false, -5);

            // 4. Kinetic Friction (f')
            if (obj.frictionForceValue > 0 && Math.abs(obj.v) > 0.01) {
                const dir = obj.v > 0 ? -1 : 1;
                // ラベル位置の調整: 左向きの時は矢印の先端の上にくるようにオフセット (-75)
                const labelOffX = (dir === -1) ? -75 : 0;
                drawArrow(centerX, centerY + obj.height/2, centerX + (frictionLen * dir), centerY + obj.height/2, '#8b5cf6', '動摩擦力 f\'', false, labelOffX);
            }
        }

        function drawArrow(x1, y1, x2, y2, color, label, isVelocity = false, labelOffsetX = 0) {
            const headlen = 15; 
            const dx = x2 - x1;
            const dy = y2 - y1;
            const angle = Math.atan2(dy, dx);

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = isVelocity ? 6 : 5; 

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();

            // Label
            ctx.font = 'bold 20px sans-serif'; 
            const lx = x2 + (dx >= 0 ? 10 : -35) + labelOffsetX;
            const ly = y2 - 10;
            ctx.fillText(label, lx, ly);
        }

        // Event Listeners
        initVRange.addEventListener('input', (e) => {
            initialV = parseFloat(e.target.value);
            initVVal.innerText = `${initialV.toFixed(1)} m/s`;
            autoReset();
            obj.v = initialV;
        });

        tensionRange.addEventListener('input', (e) => {
            obj.tension = parseFloat(e.target.value);
            tensionVal.innerText = `${obj.tension} N`;
            updateSliderConstraints();
            autoReset();
        });

        frictionRange.addEventListener('input', (e) => {
            obj.frictionForceValue = parseFloat(e.target.value);
            frictionVal.innerText = `${obj.frictionForceValue} N`;
            updateSliderConstraints();
            autoReset();
        });

        resetBtn.addEventListener('click', resetSimulation);

        startBtn.addEventListener('click', () => {
            if (!isStarted) isStarted = true;
            isRunning = !isRunning;
            if (isRunning) {
                startBtn.innerText = "一時停止";
                startBtn.className = "flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-bold text-2xl py-6 rounded-xl shadow-md transition";
            } else {
                startBtn.innerText = "再開";
                startBtn.className = "flex-1 bg-green-500 hover:bg-green-600 text-white font-bold text-2xl py-6 rounded-xl shadow-md transition";
            }
        });

        toggleVectorBtn.addEventListener('click', () => {
            showVectors = !showVectors;
            toggleVectorBtn.classList.toggle('bg-blue-600');
            toggleVectorBtn.classList.toggle('hover:bg-blue-700'); 
            toggleVectorBtn.classList.toggle('text-white');
            toggleVectorBtn.classList.toggle('hover:bg-blue-50'); 
            toggleVectorBtn.innerText = showVectors ? "作図を隠す" : "作図を表示";
        });

        window.onload = init;
    </script>
</body>
</html>
