<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等速円運動の加速度の向き</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            background: #2563eb;
            cursor: pointer;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        input[type=range]::-moz-range-thumb {
            width: 32px;
            height: 32px;
            background: #2563eb;
            cursor: pointer;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        /* Touch scroll prevention when dragging on canvas */
        .no-scroll {
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HomeIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const ListIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
        const ZoomIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>;
        const MoveIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>;
        const RotateIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;

        const App = () => {
            const [angle1, setAngle1] = useState(0);
            const [deltaAngle, setDeltaAngle] = useState(Math.PI / 4);
            const [zoom, setZoom] = useState(2.0);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const dragStart = useRef({ x: 0, y: 0 });
            const [canvasSize, setCanvasSize] = useState(300);

            const mainCanvasRef = useRef(null);
            const vectorCanvasRef = useRef(null);
            
            // Responsive canvas size adjustment
            useEffect(() => {
                const updateSize = () => {
                    const width = window.innerWidth;
                    if (width < 640) {
                        setCanvasSize(Math.min(width - 60, 240));
                    } else {
                        setCanvasSize(300);
                    }
                };
                updateSize();
                window.addEventListener('resize', updateSize);
                return () => window.removeEventListener('resize', updateSize);
            }, []);

            // Safeguard sizes with Math.max to prevent negative radius errors
            const size = canvasSize;
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = Math.max(1, (80 / 300) * size);
            const baseVectorScale = (60 / 300) * size;
            const baseObjectRadius = Math.max(1, (6 / 300) * size);

            const drawArrow = (ctx, fromX, fromY, toX, toY, color, label, labelAlign = "default", currentZoom = 1.0) => {
                const headlen = 10 * Math.max(1, currentZoom * 0.6) * (size / 300);
                const angle = Math.atan2(toY - fromY, toX - fromX);
                const lineWidth = 3 * Math.max(1, currentZoom * 0.3) * (size / 300);
                
                ctx.beginPath();
                ctx.moveTo(fromX, fromY);
                ctx.lineTo(toX, toY);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(toX, toY);
                ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.stroke();

                if (label) {
                    ctx.fillStyle = color;
                    ctx.font = `bold ${Math.max(14, 12 * currentZoom * 0.5) * (size / 300)}px sans-serif`;
                    let labelX = toX + 5;
                    let labelY = toY + 5;
                    if (labelAlign === "v2") { labelX = toX - (20 * currentZoom * 0.5 * (size/300)); labelY = toY + (5 * currentZoom * 0.5 * (size/300)); }
                    else if (labelAlign === "dv") { labelX = toX - (10 * currentZoom * 0.5 * (size/300)); labelY = toY - (10 * currentZoom * 0.5 * (size/300)); }
                    else if (labelAlign === "main_v2") { const offsetDist = 12 * (size/300); labelX = toX + Math.cos(angle) * offsetDist; labelY = toY + Math.sin(angle) * offsetDist; }
                    ctx.fillText(label, labelX, labelY);
                }
            };

            const drawMain = () => {
                const canvas = mainCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, size, size);
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.stroke();

                const angle2 = angle1 - deltaAngle;
                const p1 = { x: centerX + radius * Math.cos(angle1), y: centerY + radius * Math.sin(angle1) };
                const p2 = { x: centerX + radius * Math.cos(angle2), y: centerY + radius * Math.sin(angle2) };
                const v1 = { x: Math.sin(angle1) * baseVectorScale, y: -Math.cos(angle1) * baseVectorScale };
                const v2 = { x: Math.sin(angle2) * baseVectorScale, y: -Math.cos(angle2) * baseVectorScale };

                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = '#94a3b8';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY); ctx.lineTo(p1.x, p1.y);
                ctx.moveTo(centerX, centerY); ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                ctx.setLineDash([]);

                drawArrow(ctx, p1.x, p1.y, p1.x + v1.x, p1.y + v1.y, '#3b82f6', 'v₁');
                drawArrow(ctx, p2.x, p2.y, p2.x + v2.x, p2.y + v2.y, '#10b981', 'v₂', 'main_v2');
                ctx.beginPath();
                // Ensure radius is positive for object circle
                ctx.arc(p1.x, p1.y, Math.max(0.1, baseObjectRadius), 0, Math.PI * 2);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
            };

            const drawVector = () => {
                const canvas = vectorCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, size, size);
                const vScale = baseVectorScale * zoom;
                const angle2 = angle1 - deltaAngle;
                const v1 = { x: Math.sin(angle1) * vScale, y: -Math.cos(angle1) * vScale };
                const v2 = { x: Math.sin(angle2) * vScale, y: -Math.cos(angle2) * vScale };
                const dvMidX = (v1.x + v2.x) / 2;
                const dvMidY = (v1.y + v2.y) / 2;
                const startX = (size / 2 - dvMidX) + offset.x; 
                const startY = (size / 2 - dvMidY) + offset.y;

                // 補助線の描画 (ベクトルの後に描く指示ですが、通常背景としての線は先に描画されます。視認性のため、指示通りベクトルの座標計算後に配置します)
                ctx.save();
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = '#94a3b8'; // 色を濃く修正 (#cbd5e1 -> #94a3b8)
                ctx.lineWidth = 1;
                
                // v1方向の線
                ctx.beginPath();
                ctx.moveTo(startX - v1.x * 2, startY - v1.y * 2);
                ctx.lineTo(startX + v1.x * 3, startY + v1.y * 3);
                ctx.stroke();

                // v1に垂直な線 (v1の先端位置 startX+v1.x, startY+v1.y に描画位置を変更)
                const tipX = startX + v1.x;
                const tipY = startY + v1.y;
                const v1perp = { x: -v1.y, y: v1.x };
                ctx.beginPath();
                ctx.moveTo(tipX - v1perp.x * 2, tipY - v1perp.y * 2);
                ctx.lineTo(tipX + v1perp.x * 3, tipY + v1perp.y * 3);
                ctx.stroke();
                ctx.restore();

                ctx.beginPath();
                // Ensure radius is positive for center point circle
                ctx.arc(startX, startY, Math.max(0.1, (baseObjectRadius / 2) * zoom), 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();
                drawArrow(ctx, startX, startY, startX + v1.x, startY + v1.y, '#3b82f6', 'v₁', "default", zoom);
                drawArrow(ctx, startX, startY, startX + v2.x, startY + v2.y, '#10b981', 'v₂', 'v2', zoom);
                drawArrow(ctx, startX + v1.x, startY + v1.y, startX + v2.x, startY + v2.y, '#ef4444', 'Δv', 'dv', zoom);
            };

            useEffect(() => { drawMain(); drawVector(); }, [angle1, deltaAngle, zoom, offset, size]);

            // Mouse Events
            const handleMouseDown = (e) => { setIsDragging(true); dragStart.current = { x: e.clientX - offset.x, y: e.clientY - offset.y }; };
            const handleMouseMove = (e) => { if (!isDragging) return; setOffset({ x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y }); };
            const handleMouseUp = () => setIsDragging(false);

            // Touch Events
            const handleTouchStart = (e) => { 
                setIsDragging(true); 
                const touch = e.touches[0];
                dragStart.current = { x: touch.clientX - offset.x, y: touch.clientY - offset.y }; 
            };
            const handleTouchMove = (e) => { 
                if (!isDragging) return; 
                const touch = e.touches[0];
                setOffset({ x: touch.clientX - dragStart.current.x, y: touch.clientY - dragStart.current.y }); 
            };

            const resetPosition = () => setOffset({ x: 0, y: 0 });

            return (
                <div className="flex flex-col items-center min-h-screen bg-slate-50 p-4 font-sans text-slate-900">
                    <div className="bg-white rounded-2xl shadow-xl p-4 sm:p-6 w-full max-w-5xl border border-slate-200">
                        <div className="text-center mb-4 sm:mb-6">
                            <h1 className="text-xl sm:text-2xl font-bold text-slate-800">等速円運動の加速度の向き</h1>
                            <p className="text-slate-500 text-xs sm:text-sm">速度変化 Δvの向きから加速度の向きを考えよう</p>
                        </div>

                        {/* スライダーエリア */}
                        <div className="grid grid-cols-2 gap-3 sm:gap-4 mb-4 sm:mb-6">
                            {/* 角度差スライダー */}
                            <div className="p-2 sm:p-3 bg-blue-50/50 rounded-xl border border-blue-100 flex flex-col justify-center">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-1 sm:mb-2">
                                    <span className="text-[10px] sm:text-sm font-bold text-slate-700">角度差(=時間間隔Δt)</span>
                                    <span className="text-sm sm:text-lg font-bold text-blue-600">{(deltaAngle * 180 / Math.PI).toFixed(1)}°</span>
                                </div>
                                <input type="range" min={0.017} max={1.57} step={0.01} value={deltaAngle} onChange={(e) => setDeltaAngle(parseFloat(e.target.value))} className="w-full h-4 sm:h-5 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                            </div>

                            {/* 拡大率スライダー */}
                            <div className="p-2 sm:p-3 bg-slate-50/50 rounded-xl border border-blue-100 flex flex-col justify-center">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-1 sm:mb-2">
                                    <span className="text-[10px] sm:text-sm font-bold text-slate-700">速度変化Δvの画面の拡大</span>
                                    <div className="flex items-center gap-1 bg-white px-1 sm:px-3 py-0.5 sm:py-1 rounded-full shadow-sm border border-slate-100">
                                        <ZoomIcon />
                                        <span className="text-[10px] sm:text-sm font-bold text-blue-600">x{zoom.toFixed(1)}</span>
                                    </div>
                                </div>
                                <input type="range" min="2.0" max="15" step="0.1" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))} className="w-full h-4 sm:h-5 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                            </div>
                        </div>

                        {/* アニメーションエリア */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-stretch mb-4 sm:mb-6">
                            {/* 2. 円のアニメーション */}
                            <div className="bg-slate-50 rounded-xl p-2 border border-slate-100 flex flex-col items-center justify-center min-h-[200px] sm:min-h-[320px]">
                                <div className="bg-white rounded-lg shadow-inner p-1">
                                    <canvas ref={mainCanvasRef} width={size} height={size} className="max-w-full h-auto" />
                                </div>
                            </div>

                            {/* 3. 速度変化のアニメーション */}
                            <div className="bg-slate-50 rounded-xl p-2 border border-slate-100 flex flex-col items-center justify-between min-h-[200px] sm:min-h-[320px]">
                                <div className="w-full px-2 mb-1">
                                    <span className="text-[10px] font-bold text-slate-400">速度変化 (Δv = v₂ - v₁)</span>
                                </div>
                                <div className="relative group flex flex-col items-center justify-center w-full flex-grow">
                                    <div className="bg-white rounded-lg shadow-inner p-1">
                                        <canvas 
                                            ref={vectorCanvasRef} 
                                            width={size} 
                                            height={size} 
                                            onMouseDown={handleMouseDown} 
                                            onMouseMove={handleMouseMove} 
                                            onMouseUp={handleMouseUp} 
                                            onMouseLeave={handleMouseUp}
                                            onTouchStart={handleTouchStart}
                                            onTouchMove={handleTouchMove}
                                            onTouchEnd={handleMouseUp}
                                            className="max-w-full h-auto cursor-move no-scroll" 
                                        />
                                    </div>
                                    <div className="absolute bottom-1 right-1 bg-black/10 text-[8px] sm:text-[9px] px-2 py-1 rounded pointer-events-none flex items-center gap-1"><MoveIcon /> ドラッグで移動</div>
                                </div>
                                <button onClick={resetPosition} className="w-full mt-2 py-1.5 sm:py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-xs font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-slate-50"><RotateIcon />元の位置に戻す</button>
                            </div>
                        </div>

                        <div className="p-4 sm:p-5 bg-blue-50 rounded-2xl border border-blue-100 my-6 sm:my-10">
                            <ul className="text-xs text-blue-900/80 space-y-2 list-disc ml-5 leading-relaxed">
                                <li>加速度は「単位時間あたりの速度の変化（Δv/Δt）」であり、<span className="font-bold text-red-600">速度変化Δvの向きと加速度の向きは一致します</span>。</li>
                                <li>Δt を小さくすると、Δv（赤色のベクトル）は円の中心方向（速度v₁に垂直な方向）を向くため、加速度の向きは円の中心方向となります。</li>
                            </ul>
                        </div>

                        <div className="flex flex-col items-center gap-6 sm:gap-8 pt-6 sm:pt-8 border-t border-slate-100">
                            <div className="flex gap-4 sm:gap-6 text-sm font-bold">
                            </div>
                            <p className="text-[10px] sm:text-[11px] text-slate-400">Copyright &copy; 2021-{new Date().getFullYear()} T.Suzuki</p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
