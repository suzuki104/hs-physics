<body>
  <div class='canvas_body'>
    <h1 class="canvas_title">等速直線運動</h1>

    <div class='table'>
    <table border="1"><!--rules="groups"-->
      <thead>
      <tr>
        <td colspan = '3'>
          表示・非表示の設定
        </td>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          図
        </td>
        <td>
          x-tグラフ
        </td>
        <td>
          v-tグラフ
        </td>
      </tr>
    </tbody>
      <tr>
        <td>
          <input type='checkbox' id='strobe' checked><label for='strobe'>ストロボ表示</label><br>
          <input type='checkbox' id='xvector1'><label for='xvector1'>変位ベクトル</label><br>
          <input type='checkbox' id='vvector1'><label for='vvector1'>速度ベクトル</label>
        </td>
        <td>
          <input type='checkbox' id='graph1' checked><label for='graph1'>x-tグラフ</label><br>
          <input type='checkbox' id='xvector2'><label for='xvector2'>変位ベクトル</label><br>
        </td>
        <td>
          <input type='checkbox' id='graph2' checked><label for='graph2'>v-tグラフ</label><br>
          <input type='checkbox' id='vvector2'><label for='vvector2'>速度ベクトル</label><br>
        </td>
      </tr>
    </table>
    </div>
<br>

    速度 v[m/s]：
     <select id='velocity' class="selectbox">
       <option value='0.50'>0.5</option>
       <option value='1'>1</option>
       <option value='2' selected>2</option>
       <option value='3'>3</option>
       <option value='4'>4</option>
     </select><br>

    <button id='start'>スタート</button>
    <button id='stop'>ストップ</button>
    <button id='reset'>リセット</button>


<canvas id='myCanvas' width='1000' height='800'></canvas>
<script src='./linear_constant_velocity.js'></script>

<span id='function1' class="display_function">ここに設定した関数が表示されます(x-tグラフの式)</span>
<span id='function2' class="display_function">ここに設定した関数が表示されます(v-tグラフの式)</span>
