<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等速円運動</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 16px;
            background: #e2e8f0;
            border-radius: 8px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 3px solid white;
        }
        .math-text { font-family: 'KaTeX_Main', serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [radius, setRadius] = useState(80);
            const [angularVelocity, setAngularVelocity] = useState(2);
            const [isPlaying, setIsPlaying] = useState(true);
            const [showVectors, setShowVectors] = useState(true);
            const [isCut, setIsCut] = useState(false);
            const [time, setTime] = useState(0);
            
            const cutStateRef = useRef({ x: 0, y: 0, vx: 0, vy: 0, cutTime: 0 });
            const requestRef = useRef();
            const lastTimeRef = useRef();

            useEffect(() => {
                const renderMath = () => {
                    if (window.renderMathInElement) {
                        window.renderMathInElement(document.body, {
                            delimiters: [{left: '$', right: '$', display: false}]
                        });
                    }
                };
                renderMath();
            }, [isCut, time === 0]); 

            const animate = (timestamp) => {
                if (lastTimeRef.current !== undefined && isPlaying) {
                    const deltaTime = (timestamp - lastTimeRef.current) / 1000;
                    setTime((prevTime) => prevTime + deltaTime);
                }
                lastTimeRef.current = timestamp;
                requestRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [isPlaying]);

            let currentX, currentY, vx, vy, ax, ay;

            if (!isCut) {
                const angle = angularVelocity * time;
                currentX = radius * Math.cos(angle);
                currentY = -radius * Math.sin(angle); 

                vx = -radius * angularVelocity * Math.sin(angle);
                vy = -radius * angularVelocity * Math.cos(angle);

                ax = -radius * Math.pow(angularVelocity, 2) * Math.cos(angle);
                ay = radius * Math.pow(angularVelocity, 2) * Math.sin(angle);
            } else {
                const dt = time - cutStateRef.current.cutTime;
                currentX = cutStateRef.current.x + cutStateRef.current.vx * dt;
                currentY = cutStateRef.current.y + cutStateRef.current.vy * dt;
                vx = cutStateRef.current.vx;
                vy = cutStateRef.current.vy;
                ax = 0; ay = 0;
            }

            const handleCut = () => {
                if (isCut) return;
                setIsCut(true);
                cutStateRef.current = { x: currentX, y: currentY, vx: vx, vy: vy, cutTime: time };
            };

            const reset = () => {
                setTime(0);
                setIsCut(false);
                setIsPlaying(true);
            };

            return (
                <div className="flex flex-col min-h-screen bg-slate-50 p-4 gap-4 font-sans text-slate-900 overflow-x-hidden">
                    <h1 className="text-2xl font-bold text-slate-800 text-center py-2 mb-2">等速円運動</h1>

                    <div className="flex flex-col md:flex-row gap-4 flex-grow max-w-5xl mx-auto w-full">
                        <div className="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col min-w-0">
                            {}
                            <div className="flex justify-center items-center mb-4 gap-4">
                                <button 
                                    onClick={() => setIsPlaying(!isPlaying)} 
                                    className="px-6 py-2 rounded-full border-2 border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors font-bold text-sm"
                                >
                                    {isPlaying ? "停止" : "再開"}
                                </button>
                                <button 
                                    onClick={reset} 
                                    className="px-6 py-2 rounded-full border-2 border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors font-bold text-sm"
                                >
                                    リセット
                                </button>
                            </div>

                            <div className="relative flex-1 bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center min-h-[300px]" style={{ touchAction: 'auto' }}>
                                {/* 状態表示枠 */}
                                <div className="absolute top-4 left-4 bg-blue-500/10 backdrop-blur-md text-white px-3 py-1.5 rounded-lg text-sm border-2 border-blue-400 font-bold z-10 shadow-[0_0_15px_rgba(96,165,250,0.3)]">
                                    状態: {isCut ? '等速直線運動' : '等速円運動'}
                                </div>

                                <svg width="100%" height="100%" viewBox="-150 -150 300 300" className="max-h-full">
                                    <line x1="-150" y1="0" x2="150" y2="0" stroke="#334155" strokeWidth="1" />
                                    <line x1="0" y1="-150" x2="0" y2="150" stroke="#334155" strokeWidth="1" />
                                    
                                    {/* 軌道の点線 */}
                                    <circle cx="0" cy="0" r={radius} fill="none" stroke="#475569" strokeWidth="1.5" strokeDasharray="4 4" />
                                    
                                    {/* 糸を切った後の点線軌跡 */}
                                    {isCut && (
                                        <line x1={cutStateRef.current.x} y1={cutStateRef.current.y} x2={currentX} y2={currentY} stroke="#475569" strokeWidth="1.5" strokeDasharray="4 4" />
                                    )}
                                    
                                    {/* 糸 (切れていない時のみ) */}
                                    {!isCut && <line x1="0" y1="0" x2={currentX} y2={currentY} stroke="#94a3b8" strokeWidth="1.5" />}
                                    
                                    {/* 中心点 (白色) - 糸の後に描画して前面へ */}
                                    <circle cx="0" cy="0" r="3" fill="white" />
                                    
                                    {/* 物体 (枠なし) */}
                                    <circle cx={currentX} cy={currentY} r="8" fill="#f8fafc" />

                                    {/* ベクトル (前面に表示) */}
                                    {showVectors && (
                                        <>
                                            <line x1={currentX} y1={currentY} x2={currentX + vx * 0.2} y2={currentY + vy * 0.2} stroke="#3b82f6" strokeWidth="3" markerEnd="url(#arrow-blue)" />
                                            {!isCut && <line x1={currentX} y1={currentY} x2={currentX + ax * 0.05} y2={currentY + ay * 0.05} stroke="#ef4444" strokeWidth="3" markerEnd="url(#arrow-red)" />}
                                        </>
                                    )}

                                    <defs>
                                        <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" /></marker>
                                        <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" /></marker>
                                    </defs>
                                </svg>

                                {/* 糸を切るボタン */}
                                {!isCut && (
                                    <button onClick={handleCut} className="absolute top-4 right-4 bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-bold shadow-lg active:scale-95 transition-transform">
                                        糸を切る
                                    </button>
                                )}

                                <div className="absolute bottom-4 left-4 text-xs space-y-1 bg-black/40 p-2 rounded backdrop-blur-sm text-white border border-white/10">
                                    <div className="flex items-center gap-2"><div className="w-3 h-0.5 bg-blue-400"></div> 速度 $v$ (接線方向)</div>
                                    {!isCut && <div className="flex items-center gap-2"><div className="w-3 h-0.5 bg-red-400"></div> 向心加速度 $a$</div>}
                                </div>
                            </div>
                        </div>

                        {}
                        <div className="w-full md:w-80 space-y-4">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                <div className="space-y-10 py-4">
                                    <div>
                                        <div className="flex justify-between items-center mb-4">
                                            <label className="text-sm font-medium text-slate-700 underline decoration-blue-200 decoration-2">半径 $r$</label>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <span className="text-xs font-bold text-slate-400">小</span>
                                            <input type="range" min="20" max="120" value={radius} disabled={isCut} onChange={(e) => setRadius(Number(e.target.value))} className={`flex-grow h-4 ${isCut ? 'opacity-30' : ''}`} />
                                            <span className="text-xs font-bold text-slate-400">大</span>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-4">
                                            <label className="text-sm font-medium text-slate-700 underline decoration-blue-200 decoration-2">角速度 $\omega$</label>
                                            <span className="text-sm text-blue-600 font-mono font-bold bg-blue-50 px-2 py-0.5 rounded">{angularVelocity.toFixed(1)} rad/s</span>
                                        </div>
                                        <input type="range" min="0.5" max="4" step="0.1" value={angularVelocity} disabled={isCut} onChange={(e) => setAngularVelocity(Number(e.target.value))} className={`w-full h-4 ${isCut ? 'opacity-30' : ''}`} />
                                    </div>

                                    <div className="flex items-center gap-4 pt-4 border-t border-slate-100">
                                        <input type="checkbox" id="vectors" checked={showVectors} onChange={(e) => setShowVectors(e.target.checked)} className="w-6 h-6 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                                        <label htmlFor="vectors" className="text-sm font-bold text-slate-600 cursor-pointer">ベクトルを表示</label>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center text-sm py-2 border-b border-slate-50">
                                        <span className="text-slate-500 font-medium">速さ</span>
                                        <span className="font-mono text-blue-600 font-bold">$v = r\omega$</span>
                                    </div>
                                    <div className="flex justify-between items-center text-sm py-2 border-b border-slate-50">
                                        <span className="text-slate-500 font-medium">向心加速度</span>
                                        <span className="font-mono text-red-600 font-bold">$a = r\omega^2$</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {}
                    <div className="flex flex-col items-center gap-6 sm:gap-8 pt-6 sm:pt-8 border-t border-slate-100 mb-6">
                        <div className="flex gap-4 sm:gap-6 text-sm font-bold">
                        </div>
                        <p className="text-[10px] sm:text-[11px] text-slate-400">
                            Copyright &copy; 2021-{new Date().getFullYear()} T.Suzuki
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
