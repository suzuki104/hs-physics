<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斜面上の物体と静止摩擦力の向き</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f0f4f8;
        }
        canvas {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            height: auto;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(100%); background-color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-4 text-center">斜面上の物体と静止摩擦力の向き</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3">
                <canvas id="canvas" width="800" height="500"></canvas>
                <div class="mt-4 flex gap-2 justify-center">
                    <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-bold transition w-40 text-xl disabled:bg-gray-400 disabled:cursor-not-allowed">スタート</button>
                    <button id="resetBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-2 rounded-full font-bold transition text-xl">リセット</button>
                </div>
                <div id="status-msg" class="mt-2 text-center font-bold text-2xl h-8 hidden"></div>
            </div>

            <div class="control-panel p-6 rounded-xl border border-gray-200 shadow-sm lg:col-span-1">
                <div class="mb-6 flex items-center justify-between bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <span class="text-lg font-bold text-blue-800">摩擦を考慮する</span>
                    <label for="friction-toggle" class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" id="friction-toggle" class="sr-only" checked>
                            <div class="block bg-gray-300 w-12 h-7 rounded-full"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-5 h-5 rounded-full transition"></div>
                        </div>
                    </label>
                </div>

                <div class="mb-4">
                    <label class="block text-lg font-medium text-gray-700">質量 (m): <span id="val-mass">3.0</span> kg</label>
                    <input type="range" id="input-mass" min="1" max="20" step="0.5" value="3.0" class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
                
                <div class="mb-4">
                    <label class="block text-lg font-medium text-gray-700">張力 (T): <span id="val-tension">40</span> N</label>
                    <input type="range" id="input-tension" min="0" max="100" step="1" value="40" class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>

                <div class="mb-6 border-t pt-4">
                    <span class="block text-lg font-bold text-gray-800 mb-2">ベクトルの表示</span>
                    <div class="flex flex-wrap gap-x-4 gap-y-2 mb-4">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="show-gravity" checked class="w-5 h-5 text-blue-600 rounded">
                            <span class="ml-1 text-base text-gray-700">重力(W)</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="show-tension" checked class="w-5 h-5 text-red-600 rounded">
                            <span class="ml-1 text-base text-gray-700">張力(T)</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="show-friction" checked class="w-5 h-5 text-pink-600 rounded">
                            <span class="ml-1 text-base text-gray-700">摩擦力(f)</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="show-normal" checked class="w-5 h-5 text-blue-800 rounded">
                            <span class="ml-1 text-base text-gray-700">垂直抗力(N)</span>
                        </label>
                    </div>

                    <div class="border-t border-gray-100 pt-3 flex flex-wrap gap-x-4 gap-y-2">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="show-values" class="w-5 h-5 text-purple-600 rounded">
                            <span class="ml-1 text-base font-bold text-purple-700">数値を表示</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="show-decompose" class="w-5 h-5 text-orange-600 rounded">
                            <span class="ml-1 text-base font-bold text-orange-700">重力を分解</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-bold mb-2">静止摩擦力の向き</h2>
            <div class="text-lg text-gray-600 space-y-2">
                <ul class="list-disc ml-5">
                    <li><i>T</i> &lt; <i>W<sub>x</sub></i> のとき：摩擦力がないとき物体は斜面を下ろうとするので、静止摩擦力は<b>斜面上向き</b>に働きます。</li>
                    <li><i>T</i> &gt; <i>W<sub>x</sub></i> のとき：摩擦力がないとき物体は斜面を上ろうとするので、静止摩擦力は<b>斜面下向き</b>に働きます。</li>
                </ul>
            </div>
        </div>

        <div class="mt-12 flex flex-col items-center gap-4">
            <div class="flex gap-4">
            <!--//20260810
                <a href="../6.0_home/home.html" class="bg-gray-800 hover:bg-black text-white px-8 py-2 rounded-lg font-bold transition shadow-md">ホーム</a>
                <a href="../6.1_physics_home/physics_home.html" class="bg-gray-800 hover:bg-black text-white px-8 py-2 rounded-lg font-bold transition shadow-md">物理一覧</a>
            //20260810-->
            </div>
            <div class="text-gray-500 text-sm mt-4">
                Copyright &copy; 2021-<span id="current-year"></span> T.Suzuki
            </div>
        </div>
    </div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('status-msg');

        const g = 9.8;
        const angle = 30 * Math.PI / 180;
        const scale = 30;

        let mass = 3.0;
        let tension = 40;
        let hasFriction = true;
        let posX = 200; 
        let velocity = 0;
        let isRunning = false;
        let animationId = null;
        let frictionStaticLock = false; 

        const inputs = {
            mass: document.getElementById('input-mass'),
            tension: document.getElementById('input-tension'),
            frictionToggle: document.getElementById('friction-toggle'),
            showGravity: document.getElementById('show-gravity'),
            showTension: document.getElementById('show-tension'),
            showFriction: document.getElementById('show-friction'),
            showNormal: document.getElementById('show-normal'),
            showValues: document.getElementById('show-values'),
            showDecompose: document.getElementById('show-decompose')
        };

        const displays = {
            mass: document.getElementById('val-mass'),
            tension: document.getElementById('val-tension')
        };

        function calculateForces() {
            const gravityParallel = mass * g * Math.sin(angle);
            const gravityPerpendicular = mass * g * Math.cos(angle);
            const externalForce = tension - gravityParallel; 
            
            let friction = 0;
            let canMove = false;

            if (!isRunning) {
                if (hasFriction) {
                    friction = -externalForce;
                    canMove = false;
                } else {
                    friction = 0;
                    canMove = Math.abs(externalForce) > 0.1;
                }
            } else {
                friction = 0;
                canMove = true;
            }

            return { gravityParallel, gravityPerpendicular, externalForce, friction, canMove };
        }

        function updateInfo() {
            const { gravityParallel, canMove } = calculateForces();
            
            if (!isRunning) {
                if (frictionStaticLock) {
                    statusMsg.textContent = "静止（つり合い）";
                } else if (!canMove) {
                    statusMsg.textContent = "静止（つり合い）";
                } else {
                    const dir = (tension - gravityParallel) > 0 ? "上" : "下";
                    statusMsg.textContent = `${dir}向きに動き出します`;
                }
            }
        }

        function drawVector(x, y, vectorAngle, magnitude, color, label, actualValue = null, isDashed = false) {
            if (Math.abs(magnitude) < 0.1) return;
            const arrowSize = 30; 
            const displayLength = magnitude * 4; 
            const endX = x + Math.cos(vectorAngle) * displayLength;
            const endY = y + Math.sin(vectorAngle) * displayLength;

            ctx.save();
            if (isDashed) ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = color;
            ctx.lineWidth = isDashed ? 4 : 8; 
            ctx.stroke();

            const headAngle = Math.atan2(endY - y, endX - x);
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - arrowSize * Math.cos(headAngle - Math.PI / 6), endY - arrowSize * Math.sin(headAngle - Math.PI / 6));
            ctx.lineTo(endX - arrowSize * Math.cos(headAngle + Math.PI / 6), endY - arrowSize * Math.sin(headAngle + Math.PI / 6));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();

            ctx.fillStyle = color;
            ctx.font = "bold 24px sans-serif"; 
            let text = label;
            if (inputs.showValues.checked && actualValue !== null) {
                text += ` (${Math.abs(actualValue).toFixed(1)} N)`;
            }

            const deg = (vectorAngle * 180 / Math.PI) % 360;
            
            // ラベルの初期位置を矢印の先端付近に設定
            let tx = endX + 15;
            let ty = endY;

            if (label === "N") {
                ty -= 10;
            } else if (label === "f") {
                ty += 40;
                if (Math.abs(deg) < 5 || Math.abs(deg - 360) < 5) {
                    tx = endX + 15;
                } else {
                    tx = endX - ctx.measureText(text).width - 15;
                }
            } else if (label === "T") {
                ty -= 25;
            } else if (label === "W" || label === "Wy") {
                ty += 35;
            } else if (label === "Wx") {
                tx = endX - ctx.measureText(text).width - 15;
                ty += 35;
            }

            // 現在の変形行列（transform）を考慮してキャンバス上の絶対座標を計算する
            const matrix = ctx.getTransform();
            const globalX = tx * matrix.a + ty * matrix.c + matrix.e;
            const globalY = tx * matrix.b + ty * matrix.d + matrix.f;
            const textWidth = ctx.measureText(text).width;

            // キャンバス端からのマージン
            const margin = 10;

            // 境界判定：グローバル座標がキャンバス外に出る場合は補正する
            let finalTx = tx;
            let finalTy = ty;

            // 横方向の補正
            if (globalX < margin) {
                finalTx += (margin - globalX) / matrix.a;
            } else if (globalX + textWidth > canvas.width - margin) {
                finalTx -= (globalX + textWidth - (canvas.width - margin)) / matrix.a;
            }

            // 縦方向の補正
            if (globalY < 25) { // 上端
                finalTy += (25 - globalY) / matrix.d;
            } else if (globalY > canvas.height - margin) { // 下端
                finalTy -= (globalY - (canvas.height - margin)) / matrix.d;
            }

            ctx.fillText(text, finalTx, finalTy);
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const startX = 50;
            const startY = 450; 
            const length = 700; 

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX + length, startY);
            ctx.strokeStyle = "#eee";
            ctx.stroke();

            ctx.save();
            ctx.translate(startX, startY);
            ctx.rotate(-angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(length, 0);
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            ctx.stroke();

            if (hasFriction) {
                ctx.beginPath();
                ctx.strokeStyle = "#bbb"; 
                for (let i = 0; i < length; i += 10) {
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i - 5, 8);
                }
                ctx.stroke();
            }

            const objW = 60; 
            const objH = 40;
            const cx = posX + objW / 2;
            const cy = -objH / 2;

            if (tension > 0) {
                ctx.beginPath();
                ctx.moveTo(posX + objW, cy);
                ctx.lineTo(length, cy);
                ctx.strokeStyle = "#999";
                ctx.stroke();
            }

            ctx.fillStyle = "#3b82f6";
            ctx.fillRect(posX, -objH, objW, objH);
            ctx.strokeStyle = "#1e3a8a";
            ctx.strokeRect(posX, -objH, objW, objH);

            const { friction, gravityParallel, gravityPerpendicular } = calculateForces();

            if (inputs.showNormal.checked) {
                drawVector(cx, 0, -Math.PI / 2, gravityPerpendicular, "blue", "N", gravityPerpendicular);
            }

            if (inputs.showGravity.checked) {
                ctx.restore();
                ctx.save();
                const globX = startX + cx * Math.cos(angle) + cy * Math.sin(angle);
                const globY = startY - cx * Math.sin(angle) + cy * Math.cos(angle);
                
                if (inputs.showDecompose.checked) {
                    drawVector(globX, globY, Math.PI/2 - angle, gravityPerpendicular, "orange", "Wy", gravityPerpendicular, true);
                    drawVector(globX, globY, Math.PI - angle, gravityParallel, "orange", "Wx", gravityParallel, true);
                } else {
                    drawVector(globX, globY, Math.PI/2, mass * g, "orange", "W", mass * g);
                }
                
                ctx.restore();
                ctx.save();
                ctx.translate(startX, startY);
                ctx.rotate(-angle);
            }

            if (inputs.showTension.checked) {
                drawVector(posX + objW, cy, 0, tension, "red", "T", tension);
            }

            if (inputs.showFriction.checked && Math.abs(friction) > 0.1) {
                const fAngle = friction > 0 ? 0 : Math.PI;
                drawVector(cx, 0, fAngle, Math.abs(friction), "#db2777", "f", friction);
            }

            ctx.restore();
        }

        function update() {
            if (!isRunning) return;
            const { gravityParallel, friction } = calculateForces();
            const netForce = tension + friction - gravityParallel;
            const acceleration = netForce / mass;
            velocity += acceleration * 0.016;
            posX += velocity * scale * 0.016;
            if (posX < 0 || posX > 640) { 
                posX = Math.max(0, Math.min(640, posX));
                velocity = 0;
                isRunning = false;
                startBtn.textContent = "運動終了";
                startBtn.disabled = true;
            }
            draw();
            if (isRunning) animationId = requestAnimationFrame(update);
        }

        function performReset() {
            isRunning = false;
            frictionStaticLock = false; 
            cancelAnimationFrame(animationId);
            posX = 200;
            velocity = 0;
            startBtn.textContent = "スタート";
            startBtn.disabled = false;
            draw();
            updateInfo();
        }

        function checkAndAutoReset() {
            if (isRunning || frictionStaticLock || startBtn.disabled) {
                performReset();
            }
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) {
                isRunning = false;
                cancelAnimationFrame(animationId);
                startBtn.textContent = "スタート";
                return;
            }
            const { canMove } = calculateForces();
            if (canMove) {
                isRunning = true;
                startBtn.textContent = "ストップ";
                update();
            } else {
                if (hasFriction) {
                    frictionStaticLock = true;
                    startBtn.textContent = "静止中";
                }
                updateInfo();
            }
        });

        resetBtn.addEventListener('click', performReset);

        inputs.mass.addEventListener('input', (e) => {
            checkAndAutoReset();
            mass = parseFloat(e.target.value);
            displays.mass.textContent = mass.toFixed(1);
            updateInfo();
            if (!isRunning) draw();
        });

        inputs.tension.addEventListener('input', (e) => {
            checkAndAutoReset();
            tension = parseFloat(e.target.value);
            displays.tension.textContent = tension;
            updateInfo();
            if (!isRunning) draw();
        });

        inputs.frictionToggle.addEventListener('change', (e) => {
            checkAndAutoReset();
            hasFriction = e.target.checked;
            updateInfo();
            if (!isRunning) draw();
        });

        [inputs.showGravity, inputs.showTension, inputs.showFriction, inputs.showNormal, inputs.showValues, inputs.showDecompose].forEach(el => {
            el.addEventListener('change', () => { if(!isRunning) draw(); });
        });

        window.onload = () => {
            updateInfo();
            draw();
        };
    </script>
</body>
</html>
