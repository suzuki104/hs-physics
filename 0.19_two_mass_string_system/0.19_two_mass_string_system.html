<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理シミュレーション：糸でつながれた物体の運動</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for LaTeX rendering -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .control-panel {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">糸でつながれた物体の運動</h1>
        
        <!-- Button Row (Full Width) -->
        <div class="mb-6 flex justify-center space-x-4">
            <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-8 rounded-full shadow-lg transition transform hover:scale-105 active:scale-95">スタート</button>
            <button id="resetBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-8 rounded-full shadow-lg transition transform hover:scale-105 active:scale-95">リセット</button>
        </div>

        <!-- Simulation and Controls Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <!-- Main Simulation Area -->
            <div class="lg:col-span-2">
                <canvas id="simCanvas" width="800" height="600" class="w-full"></canvas>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">設定・パラメータ</h2>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700">台車 A の質量 \(M\): <span id="m1Val">5.0</span> kg</label>
                    <input type="range" id="m1Input" min="0.5" max="30" step="0.5" value="5" class="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer mt-2">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700">おもり B の質量 \(m\): <span id="m2Val">10.0</span> kg</label>
                    <input type="range" id="m2Input" min="1" max="50" step="1" value="10" class="w-full h-2 bg-red-200 rounded-lg appearance-none cursor-pointer mt-2">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700">重力加速度 \(g\): <span id="gVal">9.8</span> m/s²</label>
                    <input type="range" id="gInput" min="1" max="50" step="0.1" value="9.8" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mt-2">
                </div>

                <div class="mt-8 p-4 bg-blue-50 rounded-lg border border-blue-100">
                    <h3 class="font-bold text-blue-800 mb-2">理論値（計算結果）</h3>
                    <div class="text-sm space-y-2 text-gray-700">
                        <p>加速度 \(a = \frac{m}{M+m}g\) : <span id="calcA" class="font-mono font-bold text-blue-600">--</span> m/s²</p>
                        <p>張力 \(T = \frac{Mm}{M+m}g\) : <span id="calcT" class="font-mono font-bold text-blue-600">--</span> N</p>
                        <p>現在の速度 \(v\) : <span id="currV" class="font-mono font-bold text-green-600">0.00</span> m/s</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Navigation -->
        <footer class="mt-12 mb-8 border-t pt-8">
            <!--//20260810
            <div class="flex justify-center space-x-4 mb-6">
                <a href="../6.0_home/home.html" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-8 rounded shadow transition">ホーム</a>
                <a href="../6.1_physics_home/physics_home.html" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-8 rounded shadow transition">物理一覧</a>
            </div> //20260810-->
            <p class="text-center text-gray-500 text-sm" id="copyright"></p>
        </footer>
    </div>

    <script>
        // Set dynamic copyright year
        document.getElementById('copyright').innerHTML = `Copyright &copy; 2021-${new Date().getFullYear()} T.Suzuki`;

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        const m1Input = document.getElementById('m1Input');
        const m2Input = document.getElementById('m2Input');
        const gInput = document.getElementById('gInput');

        const m1Val = document.getElementById('m1Val');
        const m2Val = document.getElementById('m2Val');
        const gVal = document.getElementById('gVal');
        const calcA = document.getElementById('calcA');
        const calcT = document.getElementById('calcT');
        const currV = document.getElementById('currV');

        // Simulation State
        let isRunning = false;
        let time = 0;
        let pos = 0; 
        let animationId;

        // Constants for drawing
        const scale = 50; 
        const originX = 50;
        const tableY = 250; 
        const pulleyX = 700; 
        const pulleyRadius = 20;
        const cartHeight = 60; 
        const wheelRadius = 10; 

        // Vector length factors (pixels per unit)
        const forceFactor = 1.0; 
        const velocityFactor = 5.0; 

        const timeSpeed = 1.0; 

        function updateParams() {
            m1Val.textContent = m1Input.value;
            m2Val.textContent = m2Input.value;
            gVal.textContent = gInput.value;

            const M = parseFloat(m1Input.value);
            const m = parseFloat(m2Input.value);
            const g = parseFloat(gInput.value);

            const a = (m * g) / (M + m);
            const T = (M * m * g) / (M + m);

            calcA.textContent = a.toFixed(2);
            calcT.textContent = T.toFixed(2);
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const M = parseFloat(m1Input.value);
            const m = parseFloat(m2Input.value);
            const g = parseFloat(gInput.value);
            const a = (m * g) / (M + m);
            const currentVValue = a * time;
            
            const cartWidth = 60 + (M / 30) * 140;
            const sizeB = 30 + (m / 50) * 40;

            const bodyY = tableY - cartHeight - wheelRadius * 2;
            const ropeY = bodyY + cartHeight / 2;
            const pulleyY = ropeY + pulleyRadius;

            // Theoretical values for vector drawing
            const T = (M * m * g) / (M + m);
            const weightB = m * g;

            // 滑車の支柱
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(pulleyX, pulleyY);
            const supportLen = 60;
            ctx.lineTo(pulleyX - supportLen * 0.707, pulleyY + supportLen * 0.707);
            ctx.stroke();

            // 床面
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(0, tableY, pulleyX - 20, canvas.height - tableY);
            
            // 水平面の境界線
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, tableY);
            ctx.lineTo(pulleyX - 20, tableY);
            ctx.stroke();

            // 壁
            ctx.beginPath();
            ctx.moveTo(pulleyX - 20, tableY);
            ctx.lineTo(pulleyX - 20, canvas.height);
            ctx.stroke();

            // Draw Pulley
            ctx.beginPath();
            ctx.arc(pulleyX, pulleyY, pulleyRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#475569';
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(pulleyX, pulleyY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // Current positions
            const cartX = originX + pos * scale;
            const objBY = pulleyY + (pos * scale) + 40; 

            // Draw Strings
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cartX + cartWidth, ropeY);
            ctx.lineTo(pulleyX, ropeY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(pulleyX + pulleyRadius, pulleyY);
            ctx.lineTo(pulleyX + pulleyRadius, Math.min(objBY, canvas.height + 50)); 
            ctx.stroke();

            // --- Draw Cart A ---
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(cartX, bodyY, cartWidth, cartHeight);
            ctx.strokeStyle = '#1d4ed8';
            ctx.lineWidth = 2;
            ctx.strokeRect(cartX, bodyY, cartWidth, cartHeight);
            
            // Wheels
            ctx.fillStyle = '#1e293b';
            const wheelOffset = wheelRadius * 2;
            ctx.beginPath();
            ctx.arc(cartX + wheelOffset, tableY - wheelRadius, wheelRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cartX + cartWidth - wheelOffset, tableY - wheelRadius, wheelRadius, 0, Math.PI * 2);
            ctx.fill();

            // --- Draw Weight B ---
            if (objBY < canvas.height) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(pulleyX + pulleyRadius - sizeB / 2, objBY, sizeB, sizeB);
                ctx.strokeStyle = '#b91c1c';
                ctx.strokeRect(pulleyX + pulleyRadius - sizeB / 2, objBY, sizeB, sizeB);
            }

            // Labels
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`台車 A (${M}kg)`, cartX, bodyY - 10);
            if (objBY < canvas.height - 20) {
                ctx.fillText(`おもり B`, pulleyX + pulleyRadius + sizeB/2 + 10, objBY + sizeB/2 - 5);
                ctx.font = 'normal 14px sans-serif';
                ctx.fillText(`(${m}kg)`, pulleyX + pulleyRadius + sizeB/2 + 10, objBY + sizeB/2 + 15);
            }

            // --- Vectors ---
            const tLen = T * forceFactor;
            const mgLen = weightB * forceFactor;
            const vLen = currentVValue * velocityFactor;

            // Force Vectors
            drawVector(cartX + cartWidth, ropeY, tLen, 0, '#2563eb', 'T'); 
            if (objBY < canvas.height - 20) {
                drawVector(pulleyX + pulleyRadius, objBY, 0, -tLen, '#2563eb', 'T'); 
                drawVector(pulleyX + pulleyRadius, objBY + sizeB / 2, 0, mgLen, '#b91c1c', 'mg', true); 
            }

            // Velocity Vectors
            const velocityColor = '#10b981';
            drawVector(cartX + cartWidth / 2, bodyY - 30, vLen, 0, velocityColor, 'v');
            if (objBY < canvas.height - 20) {
                drawVector(pulleyX + pulleyRadius + sizeB/2 + 5, objBY + sizeB/2, 0, vLen, velocityColor, 'v');
            }
        }

        function drawVector(x, y, dx, dy, color, label, hasOutline = false) {
            if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

            const angle = Math.atan2(dy, dx);
            const head = Math.min(10, Math.sqrt(dx*dx + dy*dy) * 0.5);

            if (hasOutline) {
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + dx, y + dy);
                ctx.stroke();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.moveTo(x + dx, y + dy);
                ctx.lineTo(x + dx - (head + 2) * Math.cos(angle - Math.PI / 6), y + dy - (head + 2) * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x + dx - (head + 2) * Math.cos(angle + Math.PI / 6), y + dy - (head + 2) * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();
            }

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + dx, y + dy);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - head * Math.cos(angle - Math.PI / 6), y + dy - head * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x + dx - head * Math.cos(angle + Math.PI / 6), y + dy - head * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();

            ctx.font = 'italic bold 14px serif';
            ctx.shadowBlur = (hasOutline || color === '#10b981') ? 4 : 0;
            ctx.shadowColor = 'white';
            
            let lx = x + dx + (dx === 0 ? 8 : (dx > 0 ? 5 : -15));
            let ly = y + dy + (dy === 0 ? -5 : (dy > 0 ? 15 : -8));
            ctx.fillText(label, lx, ly);
            
            ctx.shadowBlur = 0;
        }

        function animate() {
            if (!isRunning) return;

            const M = parseFloat(m1Input.value);
            const m = parseFloat(m2Input.value);
            const g = parseFloat(gInput.value);
            const a = (m * g) / (M + m);

            time += (0.016 * timeSpeed); 
            pos = 0.5 * a * time * time;
            const currentVValue = a * time;
            currV.textContent = currentVValue.toFixed(2);

            const cartWidth = 60 + (M / 30) * 140;
            const collisionDistancePx = (pulleyX - 20) - (originX + cartWidth); 
            
            const isACollided = pos * scale >= collisionDistancePx;
            const isBOut = (pos * scale) > 600;

            if (isACollided || isBOut) {
                if (isACollided) pos = collisionDistancePx / scale;
                isRunning = false;
                startBtn.textContent = 'リセットして開始';
            }

            draw();
            if (isRunning) {
                animationId = requestAnimationFrame(animate);
            }
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                if (startBtn.textContent === 'リセットして開始') {
                    reset();
                }
                isRunning = true;
                animate();
                startBtn.textContent = '一時停止';
            } else {
                isRunning = false;
                cancelAnimationFrame(animationId);
                startBtn.textContent = '再開';
            }
        });

        function reset() {
            isRunning = false;
            cancelAnimationFrame(animationId);
            time = 0;
            pos = 0;
            currV.textContent = "0.00";
            startBtn.textContent = 'スタート';
            draw();
        }

        resetBtn.addEventListener('click', reset);
        
        [m1Input, m2Input, gInput].forEach(input => {
            input.addEventListener('input', () => {
                updateParams();
                if (!isRunning) {
                    reset(); 
                }
            });
        });

        updateParams();
        draw();
    </script>
</body>
</html>
